<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriStock</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F3EFE5; --surface-3:#EBE5D6;
    --border:#E3DDCD; --ink:#24231D; --ink-2:#5C5949; --ink-3:#938F7C;
    --accent:#2F6F5E; --accent-ink:#FFFFFF; --accent-soft:#DFEEE8; --accent-soft-ink:#1F4B3F;
    --good:#3D8B52; --good-soft:#E3F2E6; --good-ink:#1F5C31;
    --warn:#B9791A; --warn-soft:#FBEEDC; --warn-ink:#7A4E0E;
    --crit:#C1473A; --crit-soft:#FBE4E1; --crit-ink:#8A3128;
    --shadow: 0 1px 2px rgba(36,35,29,.06), 0 4px 14px rgba(36,35,29,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181B17; --surface:#20241F; --surface-2:#262B24; --surface-3:#2E332C;
      --border:#373C33; --ink:#EDEAE0; --ink-2:#B7B2A0; --ink-3:#83806F;
      --accent:#63BB9D; --accent-ink:#0E241D; --accent-soft:#233A32; --accent-soft-ink:#8FD6BC;
      --good:#72BF85; --good-soft:#25352A; --good-ink:#9BDBAB;
      --warn:#E0A64B; --warn-soft:#3A2F1D; --warn-ink:#F0C784;
      --crit:#E2776A; --crit-soft:#3A2521; --crit-ink:#F3A79C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181B17; --surface:#20241F; --surface-2:#262B24; --surface-3:#2E332C;
    --border:#373C33; --ink:#EDEAE0; --ink-2:#B7B2A0; --ink-3:#83806F;
    --accent:#63BB9D; --accent-ink:#0E241D; --accent-soft:#233A32; --accent-soft-ink:#8FD6BC;
    --good:#72BF85; --good-soft:#25352A; --good-ink:#9BDBAB;
    --warn:#E0A64B; --warn-soft:#3A2F1D; --warn-ink:#F0C784;
    --crit:#E2776A; --crit-soft:#3A2521; --crit-ink:#F3A79C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;line-height:1.55}
  h1,h2,h3{font-family:"Shippori Mincho",serif;font-weight:700;margin:0;text-wrap:balance}
  button{font-family:inherit}
  input,select{font-family:inherit;color:inherit}
  .app{max-width:960px;margin:0 auto;padding:0 16px 96px}

  header.top{padding:28px 4px 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header.top .brand{display:flex;align-items:baseline;gap:10px}
  header.top h1{font-size:26px;letter-spacing:.02em}
  header.top .tagline{color:var(--ink-3);font-size:12.5px}
  header.top .today{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}

  nav.tabs{display:flex;gap:6px;padding:4px;background:var(--surface-2);border-radius:14px;border:1px solid var(--border);margin-bottom:22px;position:sticky;top:10px;z-index:5}
  nav.tabs button{flex:1;padding:10px 6px;border:none;background:transparent;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
  nav.tabs button.active{background:var(--surface);color:var(--accent-soft-ink);box-shadow:var(--shadow);font-weight:700}
  nav.tabs button:hover:not(.active){color:var(--ink)}
  .tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;vertical-align:middle}

  section.panel{display:none}
  section.panel.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 18px;box-shadow:var(--shadow)}
  .card + .card{margin-top:16px}
  .card h2{font-size:16px;margin-bottom:4px}
  .card .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:14px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat-tile .label{color:var(--ink-3);font-size:12px;margin-bottom:6px}
  .stat-tile .value{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;font-family:"Shippori Mincho",serif}
  .stat-tile .value small{font-size:14px;color:var(--ink-3);font-weight:400;font-family:inherit}

  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .meter{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
  .meter .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
  .meter .mh .name{font-weight:700;font-size:13.5px}
  .meter .mh .nums{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .track{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
  .fill{height:100%;border-radius:5px;background:var(--accent)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:8px}
  .badge.good{background:var(--good-soft);color:var(--good-ink)}
  .badge.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .badge.crit{background:var(--crit-soft);color:var(--crit-ink)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  .empty{padding:30px 12px;text-align:center;color:var(--ink-3)}
  .empty .glyph{font-size:26px;margin-bottom:8px;opacity:.7}
  .empty p{margin:0 0 12px;font-size:13.5px}

  .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:10px;cursor:pointer}
  .btn:hover{filter:brightness(1.06)}
  .btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--border)}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid transparent;padding:6px 10px;font-weight:500}
  .btn.ghost:hover{color:var(--crit)}
  .btn.small{padding:6px 12px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .list{display:flex;flex-direction:column;gap:8px}
  .row-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
  .row-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .row-item .main{flex:1;min-width:0}
  .row-item .name{font-weight:700;font-size:14px}
  .row-item .meta{color:var(--ink-3);font-size:12px;margin-top:2px}
  .row-item .tag{font-size:11px;color:var(--ink-2);background:var(--surface-2);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .row-item .days{font-size:12px;font-weight:700;white-space:nowrap}

  .suggest-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--accent-soft)}
  .suggest-card .ic{font-size:20px;line-height:1}
  .suggest-card .t{font-weight:700;font-size:13.5px;color:var(--accent-soft-ink)}
  .suggest-card .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .suggest-list{display:flex;flex-direction:column;gap:10px}

  form.inline{display:grid;grid-template-columns:1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.02em}
  .field input,.field select{padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13.5px}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
  .hint{font-size:11.5px;color:var(--ink-3)}

  .pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pill-tabs button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer}
  .pill-tabs button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .photo-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .photo-preview{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .photo-row{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
  .photo-row-top{display:flex;align-items:center;gap:10px}
  .photo-row .pi-check{flex-shrink:0;width:16px;height:16px;accent-color:var(--accent)}
  .photo-row .main{flex:1;min-width:0}
  .photo-row .name{font-weight:700;font-size:14px}
  .photo-row .meta{color:var(--ink-3);font-size:12px;margin-top:2px}
  .photo-row .qty{width:88px;flex-shrink:0}
  .photo-row .qty label{display:block;font-size:10px;color:var(--ink-3);margin-bottom:2px}
  .photo-row .qty input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
  .photo-row .link-row{display:flex;align-items:center;gap:6px;padding-left:28px}
  .photo-row .link-row label{font-size:10px;color:var(--ink-3);white-space:nowrap;flex-shrink:0}
  .photo-row .link-row select{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:inherit}

  .totals-bar{display:flex;flex-wrap:wrap;gap:14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
  .totals-bar b{color:var(--ink);font-variant-numeric:tabular-nums}

  .disclaimer{font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--border);margin-top:16px;padding-top:12px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;display:flex;align-items:center;gap:6px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;flex-shrink:0}

  .quick-form{display:flex;gap:6px;margin-top:8px}
  .quick-form input{width:0;flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
  .quick-form input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .quick-form button{flex-shrink:0}
  .stat-tile .note{font-size:11px;color:var(--ink-3);margin-top:6px}

  .step-presets{display:flex;gap:6px;margin-top:10px}
  .step-presets button{flex:1;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);border-radius:8px;padding:6px 4px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.5;text-align:center}
  .step-presets button span{display:block;font-weight:400;color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
  .step-presets button:hover{border-color:var(--accent);color:var(--ink)}

  .scanner-overlay{position:fixed;inset:0;background:rgba(20,18,12,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .scanner-overlay[hidden]{display:none}
  .scanner-box{background:var(--surface);border-radius:16px;padding:14px;max-width:440px;width:100%;box-shadow:var(--shadow)}
  .scanner-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .scanner-head span{font-weight:700;font-size:14px}
  .scanner-viewport{position:relative;width:100%;background:#111;border-radius:10px;overflow:hidden;line-height:0}
  .scanner-viewport video{width:100%;height:auto;display:block}
  .scanner-guide{position:absolute;top:8%;bottom:8%;left:38%;width:24%;border:2px solid rgba(255,255,255,.9);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
  .scanner-hint{font-size:12px;color:var(--ink-3);margin-top:8px;text-align:center}
  .barcode-note{font-size:11.5px;color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:2px}

  @media (max-width:600px){
    header.top{padding-top:20px}
    .app{padding-bottom:100px}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>NutriStock</h1>
      <span class="tagline">栄養バランス × 食材ロスゼロ</span>
    </div>
    <div class="today" id="todayLabel"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active">ホーム</button>
    <button data-tab="pantry">パントリー<span class="tab-badge" id="pantryBadge" hidden>0</span></button>
    <button data-tab="meals">食事記録</button>
    <button data-tab="settings">設定</button>
  </nav>

  <!-- HOME -->
  <section class="panel active" data-panel="home" id="panel-home"></section>

  <!-- PANTRY -->
  <section class="panel" data-panel="pantry" id="panel-pantry"></section>

  <!-- MEALS -->
  <section class="panel" data-panel="meals" id="panel-meals"></section>

  <!-- SETTINGS -->
  <section class="panel" data-panel="settings" id="panel-settings"></section>
</div>

<div class="scanner-overlay" id="scannerOverlay" hidden>
  <div class="scanner-box">
    <div class="scanner-head"><span>バーコードをスキャン</span><span style="display:flex;gap:6px"><button type="button" id="scannerFlipBtn" class="btn ghost small" style="display:none">🔄 カメラ切替</button><button type="button" id="scannerClose" class="btn ghost small">閉じる</button></span></div>
    <div class="scanner-viewport"><video id="scannerVideo"></video><div class="scanner-guide"></div></div>
    <div class="scanner-hint" id="scannerHint">バーコードを縦向き(90度回転)にして枠に合わせてください。正面のままだと読み取れないことが多いです</div>
    <button type="button" id="scannerShareBtn" class="btn small" style="margin-top:10px;display:none">📤 画像を共有</button>
    <button type="button" id="scannerManualShareBtn" class="btn secondary small" style="margin-top:10px;display:none">📷 今の映像を保存（失敗中でもOK）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

var hasUnsyncedLocalChange = false;
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function persist(fields){
  try{ localStorage.setItem("nutristock_state", JSON.stringify(state)); }catch(e){}
  if(fields) showToast("保存しました");
  if(!dbDoc){ hasUnsyncedLocalChange = true; return; }
  if(!fields || !dbReady){
    dbDoc.set(state).catch(function(){});
    hasUnsyncedLocalChange = false;
    return;
  }
  var patch = {};
  fields.forEach(function(k){ patch[k] = state[k]; });
  dbDoc.update(patch).catch(function(){ dbDoc.set(state).catch(function(){}); });
}
function loadLocal(){
  try{
    var raw = localStorage.getItem("nutristock_state");
    if(raw){ var parsed = JSON.parse(raw); if(parsed && typeof parsed==="object"){ state = Object.assign(defaultState(), parsed); } }
  }catch(e){}
}
async function initDb(){
  loadLocal();
  renderAll();
  try{
    var db = await claude.use("db");
    if(!db) return;
    dbDoc = db.doc("app/state");
    dbDoc.onSnapshot(function(snap){
      var firstDelivery = !dbReady;
      if(snap.exists){
        var data = snap.data();
        if(data && typeof data==="object"){
          if(firstDelivery && hasUnsyncedLocalChange){
            /* the viewer already changed something locally before the db connection finished —
               keep their edit and push it, rather than letting stale server data silently discard it */
            dbDoc.set(state).catch(function(){});
            hasUnsyncedLocalChange = false;
          } else {
            var incoming = JSON.stringify(data);
            if(incoming !== JSON.stringify(state)){
              state = Object.assign(defaultState(), deepClone(data));
              renderAll();
            }
          }
        }
      } else if(!dbReady){
        dbDoc.set(state).catch(function(){});
      }
      dbReady = true;
    }, function(){ /* degrade silently, keep local persistence */ });
  }catch(e){}
}

/* downscale to keep the base64 payload small (faster + cheaper); vision input doesn't need full resolution */
function fileToInlineImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxSide = 1024;
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxSide/Math.max(w,h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      c.getContext("2d").drawImage(img, 0, 0, cw, ch);
      var dataUrl = c.toDataURL("image/jpeg", 0.82);
      cb({ mimeType:"image/jpeg", data: dataUrl.split(",")[1] || "" });
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

function per100FromPhotoItem(it){
  var g = it.estimatedGrams>0 ? it.estimatedGrams : 0;
  function r(v){ return g>0 ? (Number(v)||0)/g*100 : 0; }
  return {kcal:r(it.kcal),p:r(it.protein),f:r(it.fat),c:r(it.carb),fiber:r(it.fiber),salt:r(it.salt)};
}
function nutrientsForPhotoItem(item, qty){

  };
}

var zxingLoading = null;
var scannerActive = false;
var pendingBarcode = null;
var onBarcodeDetected = null; /* set by whoever opens the scanner */
var zxingReader = null;

function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(zxingLoading) return zxingLoading;
  zxingLoading = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js";
    s.onload = function(){ resolve(window.ZXing); };
    s.onerror = function(){ reject(new Error("load_failed")); };
    document.head.appendChild(s);
  });
  return zxingLoading;
}

function setScannerHint(msg){
  var h = document.getElementById("scannerHint");
  if(h) h.textContent = msg;
}

var preferredCameraId = null;
try{ preferredCameraId = localStorage.getItem("nutristock_cameraId") || null; }catch(e){}
var availableCameras = [];

function decodeResultCallback(ZXing){
  return function(result, err){
    if(!scannerActive) return;
    if(result){
      var fmt = result.getBarcodeFormat ? result.getBarcodeFormat() : null;
      if(fmt !== ZXing.BarcodeFormat.EAN_13){
        console.log("[NutriStock] EAN-13以外を検知したため無視:", fmt, result.getText());
        return; /* JANコード(EAN-13)以外は商品バーコードとして扱わない */
      }
      handleBarcodeDetected(result.getText());
      return;
    }
    /* err fires continuously while no barcode is in frame — expected, ignore it */
  };
}
async function startDecoding(ZXing){
  scannerActive = true;
  setScannerHint("カメラを起動しています…");
  zxingReader.decodeFromVideoDevice(
    preferredCameraId || undefined,
    "scannerVideo",
    decodeResultCallback(ZXing)
  ).then(function(){
    console.log("[NutriStock] カメラ起動成功、読み取り待機中…");
    setScannerHint("バーコードを縦向き(90度回転)にして枠に合わせてください。正面のままだと読み取れないことが多いです");
  }).catch(function(err){
    var detail = err && (err.name || err.message) ? (err.name||"")+" "+(err.message||"") : "";
    setScannerHint("カメラを起動できませんでした。権限が許可されているか確認してください。" + (detail ? "（"+detail+"）" : ""));
  });
}

async function openScanner(onDetected){
  onBarcodeDetected = onDetected;

  overlay.hidden = false;

  document.getElementById("scannerManualShareBtn").style.display = DEBUG_MODE ? "" : "none";
  setScannerHint("カメラを起動しています…");
  try{
    var ZXing = await loadZXing();
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingReader = new ZXing.BrowserMultiFormatReader(hints);

    try{
      availableCameras = await zxingReader.listVideoInputDevices();
      document.getElementById("scannerFlipBtn").style.display = availableCameras.length > 1 ? "" : "none";
      if(!preferredCameraId){
        var back = availableCameras.find(function(d){ return /back|rear|environment/i.test(d.label); });
        var chosen = back || availableCameras[0];
        if(chosen){
          preferredCameraId = chosen.deviceId;
          try{ localStorage.setItem("nutristock_cameraId", preferredCameraId); }catch(e){}
        }
      }
    }catch(e){ availableCameras = []; }

    await startDecoding(ZXing);
  }catch(e){
    var detail2 = e && (e.name || e.message) ? (e.name||"")+" "+(e.message||"") : "";
    setScannerHint("バーコード読み取り機能を読み込めませんでした。通信環境を確認してください。" + (detail2 ? "（"+detail2+"）" : ""));

  preferredCameraId = next.deviceId;
  try{ localStorage.setItem("nutristock_cameraId", preferredCameraId); }catch(e){}

function captureSnapshot(code, cb){

  try{
    var c = document.createElement("canvas");
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext("2d").drawImage(video, 0, 0);
    c.toBlob(function(blob){
      if(!blob){ cb(null); return; }
      var filename = "barcode-scan-" + Date.now() + "-" + code + ".jpg";
      cb(new File([blob], filename, { type: "image/jpeg" }));
    }, "image/jpeg", 0.85);

}

function handleBarcodeDetected(code){
  if(!scannerActive || !code) return;
  /* EAN's own check digit already screens out most noise; a successful decode is rare
     enough in practice that requiring a second consecutive match made real reads almost
     never confirm, so accept on the first valid decode. */
  console.log("[NutriStock] バーコード検知:", code);
  scannerActive = false;
  setScannerHint("認識しました！ (JAN: " + code + ")");
  var proceed = function(){
    var overlay = document.getElementById("scannerOverlay");
    if(overlay && overlay.hidden) return; /* viewer already closed it manually during the delay */
    closeScanner();
    if(onBarcodeDetected) onBarcodeDetected(code);
  };
  if(!DEBUG_MODE){ setTimeout(proceed, 550); return; }
  captureSnapshot(code, function(file){
    lastSnapshotFile = file;
    lastSnapshotCode = code;
    if(file) document.getElementById("scannerShareBtn").style.display = "";
    setTimeout(proceed, 4000); /* debug mode: leave more time to tap "share" before auto-continuing */
  });
}
function closeScanner(){
  scannerActive = false;
  try{ if(zxingReader){ zxingReader.reset(); } }catch(e){}
  lastSnapshotFile = null;
  lastSnapshotCode = null;
  document.getElementById("scannerShareBtn").style.display = "none";
  var overlay = document.getElementById("scannerOverlay");
  if(overlay) overlay.hidden = true;
}

function geminiPhotoItemsFromResponseText(text, validPantryIds){
  var cleaned = String(text||"").trim().replace(/^```[a-zA-Z]*\n?/,"").replace(/```\s*$/,"").trim();
  var parsed = JSON.parse(cleaned);
  var arr = Array.isArray(parsed) ? parsed : (parsed && typeof parsed==="object" ? [parsed] : []);
  return arr.slice(0,6).map(function(it){
    var estimatedGrams = Number(it.estimatedGrams)||0;
    var vegetableGrams = Number(it.vegetableGrams)||0;
    var matchedPantryId = it.matchedPantryId && validPantryIds.indexOf(it.matchedPantryId)>=0 ? it.matchedPantryId : null;
    var item = {
      name: String(it.name||"名称不明の食品").slice(0,60),
      estimatedGrams: estimatedGrams,
      kcal: Number(it.kcal)||0, protein: Number(it.protein)||0, fat: Number(it.fat)||0,
      carb: Number(it.carb)||0, fiber: Number(it.fiber)||0, salt: Number(it.salt)||0,
      vegRatio: estimatedGrams>0 ? Math.max(0, Math.min(1, vegetableGrams/estimatedGrams)) : 0,
      matchedPantryId: matchedPantryId
    };
    item.per100 = per100FromPhotoItem(item);
    return item;
  });
}

      var timedOut = false;
      /* Gemini's free/flash tier returns 503 fairly often under load, and observed in practice
         to sometimes hang over a minute before even returning that 503 — so each attempt gets
         a hard timeout rather than letting the viewer stare at "解析中…" for minutes */
      for(var attempt=0; attempt<2; attempt++){
        timedOut = false;
        var controller = new AbortController();
        var timeoutId = setTimeout(function(){ timedOut = true; controller.abort(); }, 25000);
        try{
          res = await fetch(geminiUrl, {
            method: "POST",
            headers: { "content-type": "application/json", "x-goog-api-key": geminiApiKey },
            body: requestBody,
            signal: controller.signal
          });
        }catch(fetchErr){
          res = null;
        }
        clearTimeout(timeoutId);
        if(res && (res.ok || (res.status!==503 && res.status!==500))) break;
        if(attempt===0) await new Promise(function(r){ setTimeout(r, 1500); });
      }
      if(!res || !res.ok){
        var errBody = res ? await res.json().catch(function(){ return null; }) : null;
        var errStatus = errBody && errBody.error && errBody.error.status;
        var errReason = errBody && errBody.error && errBody.error.details && errBody.error.details[0] && errBody.error.details[0].reason;
        var code = timedOut ? "server_overloaded"
          : !res ? "network_error"
          : (errReason==="API_KEY_INVALID" || res.status===401 || res.status===403 || errStatus==="PERMISSION_DENIED") ? "invalid_key"
          : (res.status===429 || errStatus==="RESOURCE_EXHAUSTED") ? "rate_limited"
          : (res.status===503 || res.status===500 || errStatus==="UNAVAILABLE") ? "server_overloaded"
          : "network_error";
        photoUi.status = "error"; photoUi.error = PHOTO_ERROR_MESSAGES[code]; renderMeals(); return;
      }
      var data = await res.json();
      var text = "";
      var candidate = data.candidates && data.candidates[0];
      var parts = candidate && candidate.content && candidate.content.parts;
      (parts||[]).forEach(function(part){ if(part.text) text += part.text; });
      var validPantryIds = state.pantry.map(function(p){ return p.id; });
      photoUi.items = geminiPhotoItemsFromResponseText(text, validPantryIds);
      photoUi.status = photoUi.items.length ? "done" : "error";
      if(!photoUi.items.length) photoUi.error = "食品を認識できませんでした。もう一度お試しください。";
    }catch(e){
      photoUi.status = "error";
      photoUi.error = (e instanceof SyntaxError) ? PHOTO_ERROR_MESSAGES.invalid_json : PHOTO_ERROR_MESSAGES.network_error;
    }
    renderMeals();
  });
}

/* ---------- targets ---------- */
function calcTargets(profile){
  var bmr = profile.sex==="male"
    ? 10*profile.weight + 6.25*profile.height - 5*profile.age + 5
    : 10*profile.weight + 6.25*profile.height - 5*profile.age - 161;
  var kcal = Math.round(bmr*profile.activity);
  var protein = Math.round(profile.weight*profile.proteinPerKg);
  var fat = Math.round(kcal*0.25/9);
  var carb = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  var fiber = profile.sex==="male" ? 21 : 18;
  var salt = profile.sex==="male" ? 7.5 : 6.5;
  return {kcal:kcal, protein:protein, fat:fat, carb:carb, fiber:fiber, salt:salt, veg:350};
}

/* ---------- nutrient totals ---------- */
function nutrientsForFood(food, qty){
  var factor = qty/100;
  return {
    kcal: food.kcal*factor, protein: food.p*factor, fat: food.f*factor,
    carb: food.c*factor, fiber: food.fiber*factor, salt: food.salt*factor,
    veg: food.veg ? qty : 0
  };
}
function sumNutrients(list){
  var t = {kcal:0,protein:0,fat:0,carb:0,fiber:0,salt:0,veg:0};
  list.forEach(function(m){
    Object.keys(t).forEach(function(k){ t[k]+= (m.nutrients[k]||0); });
  });
  return t;
}
function todaysMeals(){
  var t = todayStr();
  return state.meals.filter(function(m){ return m.date===t; });
}
function todaysSteps(){
  return (state.steps && state.steps[todayStr()]) || 0;
}
/* rough estimate: ~30-40kcal per 1000 steps for an average adult, scaled by body weight when known */
function extraKcalFromSteps(steps){
  if(!steps) return 0;
  var perStep = state.profile ? state.profile.weight*0.0005 : 0.035;
  return Math.round(steps*perStep);
}

/* upper-limit nutrients should not be exceeded; the rest are minimum targets */
var UPPER_LIMIT = {fat:true, salt:true};
function nutrientStatus(key, consumed, target){
  if(!target) return "good";
  var ratio = consumed/target;
  if(UPPER_LIMIT[key]){
    if(ratio>1.0) return "crit";
    if(ratio>0.85) return "warn";
    return "good";
  }
  if(key==="kcal"){
    if(ratio<0.7 || ratio>1.2) return "warn";
    return "good";
  }
  if(ratio<0.8) return "warn";
  return "good";
}
var STATUS_LABEL = {
  fat:{good:"適正",warn:"注意",crit:"過剰"},
  salt:{good:"適正",warn:"注意",crit:"過剰"},
  kcal:{good:"適正",warn:"ズレあり",crit:"適正"},
  protein:{good:"適正",warn:"不足",crit:"不足"},
  carb:{good:"適正",warn:"不足",crit:"不足"},
  fiber:{good:"適正",warn:"不足",crit:"不足"},
  veg:{good:"適正",warn:"不足",crit:"不足"}
};

/* ---------- render: HOME ---------- */
function foodRole(f){
  if(!f) return null;
  if(f.cat==="meat" || f.cat==="fish" || f.cat==="egg_dairy" || f.cat==="soy") return "protein";
  if(f.cat==="veg" && f.veg) return "veg";
  if(f.cat==="grain") return "carb";
  return null;
}

function suggestionList(){
  var totals = sumNutrients(todaysMeals());
  var targets = state.targets;
  var pantry = state.pantry.slice().sort(function(a,b){ return daysUntil(a.expiry)-daysUntil(b.expiry); });
  var soon = pantry.filter(function(p){ return daysUntil(p.expiry)<=4; });
  if(soon.length===0) soon = pantry.slice(0,4);

  var cards = [];

  /* caution: nutrients already over their upper limit today */
  if(targets){
    var overNow = ["fat","salt"].filter(function(k){ return nutrientStatus(k, totals[k], targets[k])==="crit"; });
    if(overNow.length){
      cards.push({
        ic: "⚠️",
        t: overNow.map(function(k){ return NUTRIENT_LABEL[k]; }).join("・") + "がすでに目標を超過",
        d: "味付けや揚げ物は控えめに、次の食事は薄味・低脂質を意識しましょう"
      });
    }
  }

  var deficient = targets ? ["protein","fiber","veg"].filter(function(k){
      return nutrientStatus(k, totals[k], targets[k])!=="good";
    }).sort(function(a,b){ return (totals[a]/targets[a]) - (totals[b]/targets[b]); }) : [];

  var tagged = soon.map(function(p){
    var f = FOOD_BY_KEY[p.foodKey];
    var helps = [];
    if(f){
      if(f.p>=14) helps.push("protein");
      if(f.fiber>=2.5) helps.push("fiber");
      if(f.veg) helps.push("veg");
    }
    return { p:p, f:f, role:foodRole(f), helps:helps, days:daysUntil(p.expiry) };
  });

  var usedIds = {};
  function pickBest(pool, helpKey){
    var candidates = pool.filter(function(t){ return !usedIds[t.p.id]; });
    var withHelp = helpKey ? candidates.filter(function(t){ return t.helps.indexOf(helpKey)>=0; }) : candidates;
    var arr = withHelp.length ? withHelp : candidates;
    if(!arr.length) return null;
    arr.sort(function(a,b){ return a.days-b.days; });
    return arr[0];
  }
  var proteinPool = tagged.filter(function(t){ return t.role==="protein"; });
  var vegPool = tagged.filter(function(t){ return t.role==="veg"; });
  var carbPool = tagged.filter(function(t){ return t.role==="carb"; });

  /* combine up to 2 complementary "meal" suggestions from soon-to-expire items */
  for(var i=0;i<2;i++){
    var wantNutrient = deficient[i] || deficient[0] || null;
    var proteinNeed = wantNutrient==="protein" || !wantNutrient;
    var vegNeed = wantNutrient==="fiber" || wantNutrient==="veg" || !wantNutrient;

    var chosen = [];
    var prot = pickBest(proteinPool, proteinNeed ? "protein" : null);
    if(prot){ chosen.push(prot); usedIds[prot.p.id]=true; }
    var veg = pickBest(vegPool, vegNeed ? (wantNutrient==="fiber"?"fiber":"veg") : null);
    if(veg){ chosen.push(veg); usedIds[veg.p.id]=true; }
    if(chosen.length<2){
      var carb = pickBest(carbPool, null);
      if(carb){ chosen.push(carb); usedIds[carb.p.id]=true; }
    }
    if(!chosen.length) break;

    var coveredNutrients = [];
    chosen.forEach(function(c){ c.helps.forEach(function(h){ if(deficient.indexOf(h)>=0 && coveredNutrients.indexOf(h)<0) coveredNutrients.push(h); }); });

    var dishTitle = buildDishTitle(chosen);
    var minDays = Math.min.apply(null, chosen.map(function(c){ return c.days; }));
    var expiryText = minDays<=0 ? "本日中に期限" : "あと"+minDays+"日で期限";
    var reasonText = coveredNutrients.length ? coveredNutrients.map(function(k){ return NUTRIENT_LABEL[k]; }).join("・")+"を補給" : "食材を使い切る";
    var icon = chosen[0].f ? (CAT_ICON[chosen[0].f.cat]||"🍽️") : "🍽️";
    var items = chosen.filter(function(c){ return c.p.foodKey; }).map(function(c){
      return { foodKey: c.p.foodKey, qty: defaultServingGrams(c.f.cat), pantryId: c.p.id, unit: c.p.unit };
    });

    cards.push({ ic: icon, t: dishTitle, d: reasonText+" ・ "+expiryText, items: items });
  }

  /* fallback: remaining soon items not used in a combo above */
  var leftover = tagged.filter(function(t){ return !usedIds[t.p.id]; }).sort(function(a,b){ return a.days-b.days; });
  if(leftover.length && cards.length<4){
    leftover.slice(0, 4-cards.length).forEach(function(t){
      var d = t.days;
      cards.push({
        ic: t.f ? (CAT_ICON[t.f.cat]||"🍽️") : "⏳",
        t: t.p.name+"を早めに使いましょう",
        d: (d<=0 ? "賞味期限：今日まで" : "あと"+d+"日で期限") + " ・ 在庫 "+t.p.qty+t.p.unit,
        items: t.f ? [{ foodKey: t.p.foodKey, qty: defaultServingGrams(t.f.cat), pantryId: t.p.id, unit: t.p.unit }] : []
      });
    });
  }
  return cards.slice(0,4);
}
function defaultServingGrams(cat){
  if(cat==="grain") return 150;
  if(cat==="veg") return 80;
  return 100;
}
var DISH_STYLES = {
  meat: ["オイスター炒め","生姜炒め","にんにく醤油炒め","味噌炒め","甘辛炒め"],
  fish: ["塩焼き","味噌煮","バター醤油炒め","照り焼き"],
  soy: ["甘辛煮","味噌炒め","ごま和え","だし煮"],
  egg_dairy: ["卵とじ","ソテー","グラタン風"]
};
function pickDishStyle(seed, cat){
  var options = DISH_STYLES[cat] || ["炒め物"];
  var hash = 0;
  for(var i=0;i<seed.length;i++) hash += seed.charCodeAt(i);
  return options[hash % options.length];
}
function buildDishTitle(chosen){
  var protein = chosen.find(function(c){ return c.role==="protein"; });
  var veg = chosen.find(function(c){ return c.role==="veg"; });
  if(protein && veg && protein.f){
    return protein.p.name+"と"+veg.p.name+"の"+pickDishStyle(protein.f.key, protein.f.cat);
  }
  if(protein && protein.f){
    return protein.p.name+"の"+pickDishStyle(protein.f.key, protein.f.cat);
  }
  if(veg){
    return veg.p.name+"のスープ・和え物";
  }
  return chosen.map(function(c){ return c.p.name; }).join("＋")+"の調理";
}

  var vegTile = '<div class="stat-tile"><div class="label">本日の野菜摂取量</div><div class="value">'+Math.round(totals.veg)+' <small>/ '+(targets?targets.veg:350)+' g</small></div></div>';
  var pantryTile = '<div class="stat-tile"><div class="label">パントリー在庫</div><div class="value">'+state.pantry.length+' <small>品目</small></div></div>';
  var stepsTile = '<div class="stat-tile"><div class="label">本日の歩数（プロトタイプ用シミュレータ）</div><div class="value">'+steps.toLocaleString()+' <small>歩</small></div>'
    + '<div class="step-presets" id="stepPresets">'
    +   '<button type="button" data-steps="3000">デスクワーク<span>3,000歩</span></button>'

    +   '<button type="button" data-steps="12000">よく歩いた<span>12,000歩</span></button>'
    + '</div>'
    + '<form id="stepsForm" class="quick-form"><input id="stepsInput" type="number" min="0" step="1" inputmode="numeric" placeholder="任意の数値" value="'+(steps||"")+'"><button type="submit" class="btn small">保存</button></form>'
    + '<div class="note">実機のヘルスケア連携は将来のネイティブアプリ化で対応予定。今は動作確認用の簡易入力です。</div>'

  el.innerHTML =

    + '<div class="card"><div class="card-head"><h2>今夜のおすすめ</h2></div><div class="sub">期限が近い食材 × 不足栄養素から提案</div>'+suggestHtml+'</div>'
    + '<div class="card"><div class="card-head"><h2>賞味期限が近い食材</h2></div><div class="sub">上位5件を表示</div>'+expiringHtml+'</div>';

  document.getElementById("stepsForm").addEventListener("submit", function(e){
    e.preventDefault();

    state.steps[todayStr()] = v;
    persist(["steps"]); renderAll();
  });

    var b = e.target.closest("button[data-steps]");

    state.steps = state.steps || {};
    state.steps[todayStr()] = parseInt(b.dataset.steps, 10);
    persist(["steps"]); renderAll();
  });

  el.querySelectorAll(".suggest-log-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var s = suggestions[parseInt(btn.dataset.idx, 10)];
      if(!s || !s.items || !s.items.length) return;
      var pantryChanged = false;
      s.items.forEach(function(item){
        var f = FOOD_BY_KEY[item.foodKey];
        if(!f) return;
        var nutrients = nutrientsForFood(f, item.qty);
        state.meals.push({ id: uid(), date: todayStr(), type: "dinner", name: f.name, qty: item.qty, nutrients: nutrients, createdAt: Date.now() });
        var stock = state.pantry.find(function(p){ return p.id === item.pantryId; });
        if(stock){
          deductPantryForConsumption(stock, item.qty);
          pantryChanged = true;
        }
      });
      persist(pantryChanged ? ["meals","pantry"] : ["meals"]);
      renderAll();
    });
  });
}

function expiryBadge(days){
  if(days<0) return {color:"var(--crit)", text: Math.abs(days)+"日超過"};
  if(days<=1) return {color:"var(--crit)", text: days===0 ? "本日まで" : "あと1日"};
  if(days<=3) return {color:"var(--warn)", text:"あと"+days+"日"};
  return {color:"var(--good)", text:"あと"+days+"日"};
}
function rowItemHtml(p, showActions){
  var d = daysUntil(p.expiry);
  var b = expiryBadge(d);
  var f = FOOD_BY_KEY[p.foodKey];
  var icon = CAT_ICON[p.category] || "🍽️";
  var actions = showActions
    ? '<button class="btn ghost small minus-btn" data-id="'+p.id+'" title="1つ使った">－1</button>'
      + '<button class="btn ghost small consume-btn" data-id="'+p.id+'" title="残り全部を使い切った/廃棄した">🗑</button>'

    + '<div class="main"><div class="name">'+icon+' '+p.name+'</div><div class="meta">'+p.qty+p.unit+' ・ '+CAT_LABEL[p.category]+'</div></div>'

}

function addToShoppingList(name){
  if(!name) return;
  state.shoppingList = state.shoppingList.filter(function(s){ return s.name !== name; });
  state.shoppingList.unshift({ id: uid(), name: name, addedAt: Date.now() });
  if(state.shoppingList.length > 30) state.shoppingList.length = 30;
}
function pushRecentFood(entry){
  state.recentFoods = state.recentFoods.filter(function(r){ return r.name !== entry.name; });
  state.recentFoods.unshift(entry);
  if(state.recentFoods.length > 8) state.recentFoods.length = 8;
}
/* g/ml stock is reduced by the estimated amount actually used; count-based units
   (個・パック・本・枚・その他) have no reliable gram equivalent, so treat one use as -1 */
function deductPantryForConsumption(stock, estimatedGrams){
  var amount = (stock.unit==="g" || stock.unit==="ml") ? estimatedGrams : 1;
  stock.qty = Math.max(0, round1(stock.qty - amount));
  if(stock.qty === 0){ state.pantry = state.pantry.filter(function(p){ return p !== stock; }); }
}

      +   '<button type="button" id="pf_incBtn" class="btn small">反映する</button>'
      + '</div>'
      + '<div class="hint" style="margin-top:4px">賞味期限が違うものを別に管理したい場合は、下のフォームからそのまま新規追加できます</div></div>';
    document.getElementById("pf_incBtn").addEventListener("click", function(){
      var add = parseFloat(document.getElementById("pf_incQty").value) || 0;
      if(add <= 0) return;
      existing.qty = round1(existing.qty + add);
      persist(["pantry"]);
      pendingBarcode = null;
      renderAll();
    });
  } else {
    noteEl.innerHTML = '<div class="barcode-note">この食材は複数の在庫があります：'
      + matches.map(function(m){ return m.qty+m.unit+'（あと'+daysUntil(m.expiry)+'日）'; }).join('、')
      + '<div class="hint" style="margin-top:4px">下のフォームからそのまま新規追加できます</div></div>';
  }
}

function renderPantry(){
  var el = document.getElementById("panel-pantry");

  var presentCats = {};
  state.pantry.forEach(function(p){ presentCats[p.category] = true; });
  var catKeys = Object.keys(CAT_LABEL).filter(function(k){ return presentCats[k]; });

  var filtered = state.pantry.filter(function(p){
    var matchCat = pantryUi.category==="all" || p.category===pantryUi.category;
    var matchSearch = !pantryUi.search || p.name.toLowerCase().indexOf(pantryUi.search.toLowerCase())>=0;
    return matchCat && matchSearch;
  }).sort(function(a,b){ return daysUntil(a.expiry)-daysUntil(b.expiry); });
  var expiredList = filtered.filter(function(p){ return daysUntil(p.expiry) < 0; });
  var activeList = filtered.filter(function(p){ return daysUntil(p.expiry) >= 0; });
  if(pantryUi.expiryDays!==null){
    activeList = activeList.filter(function(p){ return daysUntil(p.expiry) <= pantryUi.expiryDays; });
  }

  var expiredHtml = expiredList.length
    ? '<div class="card" style="border-color:var(--crit)"><div class="card-head"><h2 style="color:var(--crit)">⚠️ 期限切れ（'+expiredList.length+'件）</h2></div><div class="sub">早めに使うか、処分してください</div><div class="list">'+expiredList.map(function(p){ return rowItemHtml(p, true); }).join("")+'</div></div>'
    : '';

  var listHtml = activeList.length ? '<div class="list">'+activeList.map(function(p){ return rowItemHtml(p, true); }).join("")+'</div>'
    : (state.pantry.length ? '<div class="empty"><div class="glyph">🔍</div><p>条件に一致する食材がありません。</p></div>' : '<div class="empty"><div class="glyph">🧺</div><p>まだ食材がありません。買い物から帰ったら登録しましょう。</p></div>');

  var filterHtml = state.pantry.length ? (
    '<div class="pill-tabs" id="pantryCatFilter">'
    + '<button data-cat="all" class="'+(pantryUi.category==="all"?"active":"")+'">すべて</button>'
    + catKeys.map(function(k){ return '<button data-cat="'+k+'" class="'+(pantryUi.category===k?"active":"")+'">'+CAT_LABEL[k]+'</button>'; }).join("")
    + '</div>'
    + '<div class="pill-tabs" id="pantryExpiryFilter">'
    + EXPIRY_FILTER_OPTIONS.map(function(o){ return '<button data-days="'+o.v+'" class="'+((pantryUi.expiryDays===null?"":String(pantryUi.expiryDays))===o.v?"active":"")+'">'+o.label+'</button>'; }).join("")
    + '</div>'
    + '<input type="text" id="pantrySearch" placeholder="食材名で検索" value="'+escapeAttr(pantryUi.search)+'" style="width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;margin-bottom:14px">'
  ) : '';

  var recentHtml = state.recentFoods.length
    ? '<div class="field"><label>最近使った食材</label><div class="pill-tabs" id="recentFoodChips" style="margin-bottom:0">'
      + state.recentFoods.map(function(r,idx){ return '<button type="button" data-idx="'+idx+'">'+r.name+'</button>'; }).join("")
      + '</div></div>'
    : '';

  var shoppingHtml =
    '<div class="card">'
    + '<div class="card-head"><h2>🛒 次に買うものリスト</h2></div><div class="sub">使い切った食材が自動で追加されます</div>'
    + '<form id="shoppingForm" class="quick-form" style="margin-top:0"><input type="text" id="shoppingInput" placeholder="買うものを追加"><button type="submit" class="btn small">追加</button></form>'
    + (state.shoppingList.length
        ? '<div class="list" style="margin-top:12px">' + state.shoppingList.map(function(s){
            return '<div class="row-item" data-id="'+s.id+'"><div class="main"><div class="name">'+escapeAttr(s.name)+'</div></div><button class="btn ghost small shopping-del" data-id="'+s.id+'">✓ 買った</button></div>';
          }).join("") + '</div>'
        : '<div class="empty"><div class="glyph">📝</div><p>今のところ何もありません。</p></div>');
  shoppingHtml += '</div>';

  el.innerHTML =
    '<div class="card">'
    + '<div class="card-head"><h2>食材を追加</h2></div><div class="sub">登録すると賞味期限順に一覧表示されます</div>'
    + '<form id="pantryForm" class="inline">'
    +   recentHtml
    +   '<div class="field-row">'
    +     '<div class="field"><label>食材</label><select id="pf_food">'+ '<option value="">— 選択してください —</option>' + foodOptionsHtml() + '<option value="__custom">カスタム入力…</option></select></div>'
    +     '<div class="field"><label>&nbsp;</label><button type="button" id="pf_scanBtn" class="btn secondary">📷 バーコードでスキャン</button></div>'
    +   '</div>'
    +   '<div class="field-row" id="pf_customWrap" style="display:none">'
    +     '<div class="field"><label>食材名（自由入力）</label><input id="pf_custom" type="text" placeholder="例：ちくわ"></div>'
    +     '<div class="field"><label>カテゴリ</label><select id="pf_customCat">'+ Object.keys(CAT_LABEL).map(function(k){ return '<option value="'+k+'">'+CAT_LABEL[k]+'</option>'; }).join("") +'</select></div>'
    +   '</div>'
    +   '<div id="pf_barcodeNote"></div>'
    +   '<div class="field-row">'
    +     '<div class="field"><label>数量</label><input id="pf_qty" type="number" min="0" step="0.1" placeholder="1" value="1"></div>'
    +     '<div class="field"><label>単位</label><select id="pf_unit"><option>g</option><option>個</option><option>パック</option><option>本</option><option>枚</option><option>ml</option><option>その他</option></select></div>'
    +     '<div class="field"><label>賞味期限</label><input id="pf_expiry" type="date"></div>'
    +   '</div>'
    +   '<div class="form-actions"><button type="submit" class="btn">パントリーに追加</button></div>'
    + '</form>'
    + '</div>'
    + shoppingHtml
    + expiredHtml
    + '<div class="card"><div class="card-head"><h2>在庫一覧</h2></div><div class="sub">'+activeList.length+' 品目 ・ 期限が近い順</div>'+filterHtml+listHtml+'</div>';

  document.getElementById("pf_food").addEventListener("change", function(){
    document.getElementById("pf_customWrap").style.display = this.value==="__custom" ? "" : "none";
    var f = FOOD_BY_KEY[this.value];
    if(f && f.unit) document.getElementById("pf_unit").value = f.unit;
    pendingBarcode = null;
    if(this.value && this.value!=="__custom"){
      checkExistingStock(state.pantry.filter(function(p){ return p.foodKey===f.key; }));
    } else {
      checkExistingStock([]);
    }
  });

  if(state.pantry.length){
    document.getElementById("pantryCatFilter").addEventListener("click", function(e){
      var b = e.target.closest("button[data-cat]"); if(!b) return;
      pantryUi.category = b.dataset.cat; renderPantry();
    });
    document.getElementById("pantryExpiryFilter").addEventListener("click", function(e){
      var b = e.target.closest("button[data-days]"); if(!b) return;
      pantryUi.expiryDays = b.dataset.days === "" ? null : parseInt(b.dataset.days, 10);
      renderPantry();
    });
    document.getElementById("pantrySearch").addEventListener("input", function(){
      pantryUi.search = this.value; renderPantry();
    });
  }
  var recentEl = document.getElementById("recentFoodChips");
  if(recentEl){
    recentEl.addEventListener("click", function(e){
      var b = e.target.closest("button[data-idx]"); if(!b) return;
      var r = state.recentFoods[parseInt(b.dataset.idx,10)];
      if(!r) return;
      pendingBarcode = null;
      if(r.foodKey && FOOD_BY_KEY[r.foodKey]){
        document.getElementById("pf_food").value = r.foodKey;
        document.getElementById("pf_customWrap").style.display = "none";
        checkExistingStock(state.pantry.filter(function(p){ return p.foodKey===r.foodKey; }));
      } else {
        document.getElementById("pf_food").value = "__custom";
        document.getElementById("pf_customWrap").style.display = "";
        document.getElementById("pf_custom").value = r.name;
        document.getElementById("pf_customCat").value = r.category || "other";
        checkExistingStock(state.pantry.filter(function(p){ return !p.foodKey && p.name===r.name; }));
      }
      document.getElementById("pf_unit").value = r.unit;
    });
  }

  document.getElementById("shoppingForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = document.getElementById("shoppingInput");
    var name = (input.value||"").trim();
    if(!name) return;
    addToShoppingList(name);
    input.value = "";
    persist(["shoppingList"]); renderAll();
  });
  if(!el.dataset.shoppingBound){
    el.dataset.shoppingBound = "1";
    el.addEventListener("click", function(e){
      var delBtn = e.target.closest(".shopping-del");
      if(!delBtn) return;
      state.shoppingList = state.shoppingList.filter(function(s){ return s.id!==delBtn.dataset.id; });
      persist(["shoppingList"]); renderAll();
    });
  }
  var dEl = document.getElementById("pf_expiry");
  var t = new Date(); t.setDate(t.getDate()+7);
  dEl.value = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");

  document.getElementById("pf_scanBtn").addEventListener("click", function(){
    openScanner(function(code){
      var known = state.barcodes[code];
      var existing = state.pantry.find(function(p){ return p.barcode === code; });
      console.log("[NutriStock] パントリーで受信:", code, known ? "（登録済み: "+known.name+"）" : "（新規）", existing ? "在庫あり" : "在庫なし");
      var noteEl = document.getElementById("pf_barcodeNote");
      var prefillName = known ? known.name : (existing ? existing.name : "");
      var prefillUnit = known ? known.unit : (existing ? existing.unit : null);
      var prefillCat = known ? known.category : (existing ? existing.category : null);
      document.getElementById("pf_food").value = "__custom";
      document.getElementById("pf_customWrap").style.display = "";
      document.getElementById("pf_custom").value = prefillName;
      if(prefillUnit) document.getElementById("pf_unit").value = prefillUnit;
      if(prefillCat) document.getElementById("pf_customCat").value = prefillCat;
      if(!prefillName) document.getElementById("pf_custom").focus();
      pendingBarcode = code;

      if(existing){
        checkExistingStock([existing]);
      } else if(known){
        noteEl.innerHTML = '<div class="barcode-note">前回の登録内容を自動入力しました（JAN: '+escapeAttr(code)+'）</div>';
      } else {
        noteEl.innerHTML = '<div class="barcode-note">初めてのバーコードです（JAN: '+escapeAttr(code)+'）。食材名を入力すると次回から自動入力されます</div>';
      }
    });
  });

  document.getElementById("pantryForm").addEventListener("submit", function(e){
    e.preventDefault();
    var now = Date.now();
    if(now - lastPantrySubmitAt < 800) return; /* guard against an accidental rapid double-tap adding the item twice */
    var foodKey = document.getElementById("pf_food").value;
    if(!foodKey){ return; }
    var custom = foodKey==="__custom";
    var name = custom ? (document.getElementById("pf_custom").value||"").trim() : FOOD_BY_KEY[foodKey].name;
    if(!name) return;
    var qty = parseFloat(document.getElementById("pf_qty").value)||0;
    var unit = document.getElementById("pf_unit").value;
    var expiry = document.getElementById("pf_expiry").value;
    if(!expiry) return;
    var cat = custom ? document.getElementById("pf_customCat").value : FOOD_BY_KEY[foodKey].cat;
    lastPantrySubmitAt = now;
    var barcodeChanged = false;
    if(pendingBarcode){
      state.barcodes[pendingBarcode] = { name: name, unit: unit, category: cat };
      barcodeChanged = true;
    }
    var mergeTarget = state.pantry.find(function(p){
      var sameFood = custom ? (!p.foodKey && p.name===name) : (p.foodKey===foodKey);
      return sameFood && p.expiry===expiry;
    });
    if(mergeTarget){
      mergeTarget.qty = round1(mergeTarget.qty + qty);
      if(pendingBarcode && !mergeTarget.barcode) mergeTarget.barcode = pendingBarcode;
    } else {
      state.pantry.push({ id: uid(), name: name, foodKey: custom?null:foodKey, category: cat, qty: qty, unit: unit, expiry: expiry, barcode: pendingBarcode||null, addedAt: Date.now() });
    }
    pushRecentFood({ name: name, foodKey: custom?null:foodKey, unit: unit, category: cat });
    state.shoppingList = state.shoppingList.filter(function(s){ return s.name !== name; }); /* bought it, drop from the list if present */
    pendingBarcode = null;
    var noteEl = document.getElementById("pf_barcodeNote");
    if(noteEl) noteEl.innerHTML = "";
    persist(barcodeChanged ? ["pantry","barcodes","recentFoods","shoppingList"] : ["pantry","recentFoods","shoppingList"]); renderAll();
  });

  if(!el.dataset.stockBound){
    el.dataset.stockBound = "1";
    el.addEventListener("click", function(e){
      var minusBtn = e.target.closest(".minus-btn");
      if(minusBtn){
        var item = state.pantry.find(function(p){ return p.id===minusBtn.dataset.id; });
        if(item){
          item.qty = round1(item.qty - 1);
          if(item.qty <= 0){
            state.pantry = state.pantry.filter(function(p){ return p.id!==item.id; });
            addToShoppingList(item.name);
          }
        }
        persist(["pantry","shoppingList"]); renderAll();
        return;
      }
      var btn = e.target.closest(".consume-btn");
      if(!btn) return;
      var consumed = state.pantry.find(function(p){ return p.id===btn.dataset.id; });
      state.pantry = state.pantry.filter(function(p){ return p.id!==btn.dataset.id; });
      if(consumed) addToShoppingList(consumed.name);
      persist(["pantry","shoppingList"]); renderAll();
    });
  }
}

  document.getElementById("mealTypeTabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-type]"); if(!b) return;
    mealsUi.type = b.dataset.type; renderMeals();
  });
  document.getElementById("mf_food").addEventListener("change", function(){
    document.getElementById("mf_customWrap").style.display = this.value==="__custom" ? "" : "none";
  });
  el.querySelector("#mealForm").addEventListener("submit", function(e){
    e.preventDefault();
    var foodKey = document.getElementById("mf_food").value;
    if(!foodKey) return;
    var qty = parseFloat(document.getElementById("mf_qty").value)||0;
    var name, nutrients;
    var pantryChanged = false;
    if(foodKey==="__custom"){
      name = (document.getElementById("mf_cname").value||"").trim();
      if(!name) return;
      nutrients = {
        kcal: parseFloat(document.getElementById("mf_ckcal").value)||0,
        protein: parseFloat(document.getElementById("mf_cp").value)||0,
        fat: parseFloat(document.getElementById("mf_cf").value)||0,
        carb: parseFloat(document.getElementById("mf_cc").value)||0,
        fiber: 0, salt: 0, veg: 0
      };
    } else {
      var f = FOOD_BY_KEY[foodKey];
      name = f.name;
      nutrients = nutrientsForFood(f, qty);
      var deductEl = document.getElementById("mf_deduct");
      if(deductEl && deductEl.checked){
        var stock = state.pantry.find(function(p){ return p.foodKey===foodKey; });
        if(stock){ deductPantryForConsumption(stock, qty); pantryChanged = true; }
      }
    }
    state.meals.push({ id: uid(), date: mealsUi.date, type: mealsUi.type, name: name, qty: qty, nutrients: nutrients, createdAt: Date.now() });
    persist(pantryChanged ? ["meals","pantry"] : ["meals"]); renderAll();
  });
  if(!el.dataset.mealDelBound){
    el.dataset.mealDelBound = "1";
    el.addEventListener("click", function(e){
      var b = e.target.closest(".meal-del"); if(!b) return;
      state.meals = state.meals.filter(function(m){ return m.id!==b.dataset.id; });
      persist(["meals"]); renderAll();
    });
  }

  var photoGoSettingsBtn = document.getElementById("photoGoSettingsBtn");
  if(photoGoSettingsBtn){
    photoGoSettingsBtn.addEventListener("click", function(){
      var settingsTabBtn = document.querySelector('nav.tabs button[data-tab="settings"]');
      if(settingsTabBtn) settingsTabBtn.click();
    });
  }
  var photoInputEl = document.getElementById("photoInput");
  if(photoInputEl){
    photoInputEl.addEventListener("change", function(){
      var file = this.files && this.files[0];
      if(!file) return;
      if(photoUi.previewUrl) URL.revokeObjectURL(photoUi.previewUrl);
      photoUi.file = file;
      photoUi.previewUrl = URL.createObjectURL(file);
      runPhotoAnalysis(file);
    });
  }
  var photoAddBtn = document.getElementById("photoAddBtn");
  if(photoAddBtn){
    photoAddBtn.addEventListener("click", function(){
      var rows = el.querySelectorAll(".photo-row");
      var pantryChanged = false;
      rows.forEach(function(row){
        var idx = parseInt(row.dataset.idx,10);
        var checked = row.querySelector(".pi-check").checked;
        if(!checked) return;
        var item = photoUi.items[idx];
        var qty = parseFloat(row.querySelector(".pi-qty").value)||0;
        var nutrients = nutrientsForPhotoItem(item, qty);
        state.meals.push({ id: uid(), date: mealsUi.date, type: mealsUi.type, name: item.name, qty: qty, nutrients: nutrients, createdAt: Date.now() });
        var linkSel = row.querySelector(".pi-link");
        var pantryId = linkSel ? linkSel.value : "";
        if(pantryId){
          var stock = state.pantry.find(function(p){ return p.id===pantryId; });
          if(stock){ deductPantryForConsumption(stock, qty); pantryChanged = true; }
        }
      });
      if(photoUi.previewUrl) URL.revokeObjectURL(photoUi.previewUrl);
      photoUi = { file:null, previewUrl:null, status:"idle", items:[], error:"" };
      persist(pantryChanged ? ["meals","pantry"] : ["meals"]); renderAll();
    });
  }
  var photoCancelBtn = document.getElementById("photoCancelBtn");
  if(photoCancelBtn){
    photoCancelBtn.addEventListener("click", function(){
      if(photoUi.previewUrl) URL.revokeObjectURL(photoUi.previewUrl);
      photoUi = { file:null, previewUrl:null, status:"idle", items:[], error:"" };
      renderMeals();
    });
  }
}

/* ---------- render: SETTINGS ---------- */
function renderSettings(){
  var el = document.getElementById("panel-settings");
  var p = state.profile || { sex:"male", age:30, height:170, weight:65, activity:1.375, proteinPerKg:1.2 };
  var t = state.targets;

  el.innerHTML =
    '<div class="card">'
    + '<div class="card-head"><h2>AI設定（Gemini APIキー）</h2></div>'
    + '<div class="sub">食事記録タブの「写真から記録」機能で使用します。ご自身のGemini APIキーをこの端末のブラウザ内にのみ保存します（サーバーには送らず、Gitにも含めません）。'
    +   ' <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.comでキーを発行</a>'
    +   '（Gemini Advanced等のサブスクリプションとは別枠です。無料枠がありますが、超過分はご自身のGoogleアカウントに請求されます）。</div>'
    + '<form id="apiKeyForm" class="inline">'
    +   '<div class="field"><label>Gemini APIキー</label><input id="ak_key" type="password" placeholder="AIza..." value="'+escapeAttr(geminiApiKey)+'" autocomplete="off"></div>'
    +   '<div class="hint">共有・他人と使う端末では開発者ツール等から読み取れてしまう点にご注意ください。</div>'
    +   '<div class="form-actions"><button type="button" id="ak_clear" class="btn ghost small">削除</button><button type="submit" class="btn small">保存</button></div>'
    + '</form>'
    + '</div>'
    + '<div class="card">'
    + '<div class="card-head"><h2>プロフィール</h2></div><div class="sub">身長・体重・年齢から基準の栄養目標を計算します</div>'
    + '<form id="profileForm" class="inline">'
    +   '<div class="field-row">'
    +     '<div class="field"><label>性別</label><select id="pr_sex"><option value="male"'+(p.sex==="male"?" selected":"")+'>男性</option><option value="female"'+(p.sex==="female"?" selected":"")+'>女性</option></select></div>'
    +     '<div class="field"><label>年齢</label><input id="pr_age" type="number" min="10" max="100" value="'+p.age+'"></div>'
    +   '</div>'
    +   '<div class="field-row">'
    +     '<div class="field"><label>身長 (cm)</label><input id="pr_height" type="number" min="100" max="230" value="'+p.height+'"></div>'
    +     '<div class="field"><label>体重 (kg)</label><input id="pr_weight" type="number" min="30" max="200" step="0.1" value="'+p.weight+'"></div>'
    +   '</div>'
    +   '<div class="field"><label>活動量</label><select id="pr_activity">'
    +      ACTIVITY_OPTIONS.map(function(o){ return '<option value="'+o.v+'"'+(p.activity===o.v?" selected":"")+'>'+o.label+'</option>'; }).join("")
    +   '</select></div>'
    +   (function(){
        var isPreset = PROTEIN_GOAL_OPTIONS.some(function(o){ return o.v===p.proteinPerKg; });
        return '<div class="field"><label>たんぱく質の目標</label><select id="pr_ppk_goal">'
          + PROTEIN_GOAL_OPTIONS.map(function(o){ return '<option value="'+o.v+'"'+(p.proteinPerKg===o.v?" selected":"")+'>'+o.label+'</option>'; }).join("")
          + '<option value="__custom"'+(isPreset?"":" selected")+'>カスタム（数値を直接指定）</option>'
          + '</select></div>'
          + '<div class="field" id="pr_ppk_customWrap" style="'+(isPreset?"display:none":"")+'"><label>係数 (g / 体重kg)</label><input id="pr_ppk" type="number" min="0.6" max="2.5" step="0.1" value="'+p.proteinPerKg+'"></div>';
      })()
    +   '<div class="form-actions"><button type="submit" class="btn">目標を計算して保存</button></div>'
    + '</form>'
    + '</div>'
    + (t ? (
      '<div class="card"><div class="card-head"><h2>現在の栄養目標</h2></div><div class="sub">1日あたり・必要に応じて数値を直接調整できます</div>'
      + '<form id="targetForm" class="inline"><div class="field-row">'
      + Object.keys(NUTRIENT_LABEL).map(function(k){
          var hint = k==="protein" ? '<div class="hint" style="margin-top:2px">目安：'+proteinEquivalentText(t.protein)+'</div>' : "";
          return '<div class="field"><label>'+NUTRIENT_LABEL[k]+' ('+NUTRIENT_UNIT[k]+')</label><input class="tgt" data-key="'+k+'" type="number" step="1" value="'+t[k]+'">'+hint+'</div>';
        }).join("")
      + '</div><div class="form-actions"><button type="submit" class="btn secondary">目標値を保存</button></div></form></div>'
    ) : '')
    + '<div class="disclaimer">目標値は Mifflin-St Jeor 式などをもとにした簡易的な概算です。医療的な指導が必要な場合は専門家にご相談ください。食品成分値は日本食品標準成分表に基づく概算値を使用しています。</div>';

  document.getElementById("apiKeyForm").addEventListener("submit", function(e){
    e.preventDefault();
    geminiApiKey = (document.getElementById("ak_key").value||"").trim();
    try{ localStorage.setItem("nutristock_geminiApiKey", geminiApiKey); }catch(e){}
    showToast(geminiApiKey ? "APIキーを保存しました" : "APIキーを削除しました");
    renderMeals();
  });
  document.getElementById("ak_clear").addEventListener("click", function(){
    geminiApiKey = "";
    try{ localStorage.removeItem("nutristock_geminiApiKey"); }catch(e){}
    document.getElementById("ak_key").value = "";
    showToast("APIキーを削除しました");
    renderMeals();
  });

  document.getElementById("pr_ppk_goal").addEventListener("change", function(){
    document.getElementById("pr_ppk_customWrap").style.display = this.value==="__custom" ? "" : "none";
  });

  document.getElementById("profileForm").addEventListener("submit", function(e){
    e.preventDefault();
    var goalVal = document.getElementById("pr_ppk_goal").value;
    var proteinPerKg = goalVal==="__custom"
      ? (parseFloat(document.getElementById("pr_ppk").value)||1.2)
      : parseFloat(goalVal);
    var profile = {
      sex: document.getElementById("pr_sex").value,
      age: parseFloat(document.getElementById("pr_age").value)||30,
      height: parseFloat(document.getElementById("pr_height").value)||170,
      weight: parseFloat(document.getElementById("pr_weight").value)||65,
      activity: parseFloat(document.getElementById("pr_activity").value)||1.375,
      proteinPerKg: proteinPerKg
    };
    state.profile = profile;
    state.targets = calcTargets(profile);
    persist(["profile","targets"]); renderAll();
  });

  var tf = document.getElementById("targetForm");
  if(tf){
    tf.addEventListener("submit", function(e){
      e.preventDefault();
      var newTargets = Object.assign({}, state.targets);
      el.querySelectorAll(".tgt").forEach(function(inp){ newTargets[inp.dataset.key] = parseFloat(inp.value)||0; });
      state.targets = newTargets;
      persist(["targets"]); renderAll();
    });
  }
}

/* ---------- render all ---------- */
function updatePantryTabBadge(){
  var count = state.pantry.filter(function(p){ return daysUntil(p.expiry) <= 3; }).length;
  var badge = document.getElementById("pantryBadge");
  if(!badge) return;
  if(count > 0){ badge.textContent = count > 99 ? "99+" : count; badge.hidden = false; }
  else { badge.hidden = true; }
}
function renderAll(){
  document.getElementById("todayLabel").textContent = todayStr();
  renderHome();
  renderPantry();
  renderMeals();
  renderSettings();
  updatePantryTabBadge();
}

initDb();
})();
