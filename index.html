<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriStock</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F6F5E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutriStock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F3EFE5; --surface-3:#EBE5D6;
    --border:#E3DDCD; --ink:#24231D; --ink-2:#5C5949; --ink-3:#938F7C;
    --accent:#2F6F5E; --accent-ink:#FFFFFF; --accent-soft:#DFEEE8; --accent-soft-ink:#1F4B3F;
    --good:#3D8B52; --good-soft:#E3F2E6; --good-ink:#1F5C31;
    --warn:#B9791A; --warn-soft:#FBEEDC; --warn-ink:#7A4E0E;
    --crit:#C1473A; --crit-soft:#FBE4E1; --crit-ink:#8A3128;
    --shadow: 0 1px 2px rgba(36,35,29,.06), 0 4px 14px rgba(36,35,29,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181B17; --surface:#20241F; --surface-2:#262B24; --surface-3:#2E332C;
      --border:#373C33; --ink:#EDEAE0; --ink-2:#B7B2A0; --ink-3:#83806F;
      --accent:#63BB9D; --accent-ink:#0E241D; --accent-soft:#233A32; --accent-soft-ink:#8FD6BC;
      --good:#72BF85; --good-soft:#25352A; --good-ink:#9BDBAB;
      --warn:#E0A64B; --warn-soft:#3A2F1D; --warn-ink:#F0C784;
      --crit:#E2776A; --crit-soft:#3A2521; --crit-ink:#F3A79C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181B17; --surface:#20241F; --surface-2:#262B24; --surface-3:#2E332C;
    --border:#373C33; --ink:#EDEAE0; --ink-2:#B7B2A0; --ink-3:#83806F;
    --accent:#63BB9D; --accent-ink:#0E241D; --accent-soft:#233A32; --accent-soft-ink:#8FD6BC;
    --good:#72BF85; --good-soft:#25352A; --good-ink:#9BDBAB;
    --warn:#E0A64B; --warn-soft:#3A2F1D; --warn-ink:#F0C784;
    --crit:#E2776A; --crit-soft:#3A2521; --crit-ink:#F3A79C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;line-height:1.55}
  h1,h2,h3{font-family:"Shippori Mincho",serif;font-weight:700;margin:0;text-wrap:balance}
  button{font-family:inherit}
  input,select{font-family:inherit;color:inherit}
  .app{max-width:960px;margin:0 auto;padding:0 16px 96px}

  header.top{padding:28px 4px 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header.top .brand{display:flex;align-items:baseline;gap:10px}
  header.top h1{font-size:26px;letter-spacing:.02em}
  header.top .tagline{color:var(--ink-3);font-size:12.5px}
  header.top .today{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}

  nav.tabs{display:flex;gap:6px;padding:4px;background:var(--surface-2);border-radius:14px;border:1px solid var(--border);margin-bottom:22px;position:sticky;top:10px;z-index:5}
  nav.tabs button{flex:1;padding:10px 6px;border:none;background:transparent;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
  nav.tabs button.active{background:var(--surface);color:var(--accent-soft-ink);box-shadow:var(--shadow);font-weight:700}
  nav.tabs button:hover:not(.active){color:var(--ink)}
  .tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;vertical-align:middle}

  section.panel{display:none}
  section.panel.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 18px;box-shadow:var(--shadow)}
  .card + .card{margin-top:16px}
  .card h2{font-size:16px;margin-bottom:4px}
  .card .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:14px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat-tile .label{color:var(--ink-3);font-size:12px;margin-bottom:6px}
  .stat-tile .value{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;font-family:"Shippori Mincho",serif}
  .stat-tile .value small{font-size:14px;color:var(--ink-3);font-weight:400;font-family:inherit}

  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .meter{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
  .meter .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
  .meter .mh .name{font-weight:700;font-size:13.5px}
  .meter .mh .nums{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .track{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
  .fill{height:100%;border-radius:5px;background:var(--accent)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:8px}
  .badge.good{background:var(--good-soft);color:var(--good-ink)}
  .badge.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .badge.crit{background:var(--crit-soft);color:var(--crit-ink)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  .empty{padding:30px 12px;text-align:center;color:var(--ink-3)}
  .empty .glyph{font-size:26px;margin-bottom:8px;opacity:.7}
  .empty p{margin:0 0 12px;font-size:13.5px}

  .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:10px;cursor:pointer}
  .btn:hover{filter:brightness(1.06)}
  .btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--border)}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid transparent;padding:6px 10px;font-weight:500}
  .btn.ghost:hover{color:var(--crit)}
  .btn.small{padding:6px 12px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .list{display:flex;flex-direction:column;gap:8px}
  .row-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
  .row-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .row-item .main{flex:1;min-width:0}
  .row-item .name{font-weight:700;font-size:14px}
  .row-item .meta{color:var(--ink-3);font-size:12px;margin-top:2px}
  .row-item .tag{font-size:11px;color:var(--ink-2);background:var(--surface-2);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .row-item .days{font-size:12px;font-weight:700;white-space:nowrap}
  .meal-detail summary{cursor:pointer;list-style:none;font-weight:700;font-size:14px;display:inline}
  .meal-detail summary::-webkit-details-marker{display:none}
  .meal-detail summary::before{content:"▸ ";color:var(--ink-3);font-size:11px}
  .meal-detail[open] summary::before{content:"▾ "}
  .ingredient-detail-list{margin-top:6px;padding-left:14px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
  .badge.neutral{background:var(--surface-3);color:var(--ink-2)}
  .badge.neutral::before{background:var(--ink-3)}

  .suggest-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--accent-soft)}
  .suggest-card .ic{font-size:20px;line-height:1}
  .suggest-card .t{font-weight:700;font-size:13.5px;color:var(--accent-soft-ink)}
  .suggest-card .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .suggest-list{display:flex;flex-direction:column;gap:10px}

  form.inline{display:grid;grid-template-columns:1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.02em}
  .field input,.field select{padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13.5px}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
  .hint{font-size:11.5px;color:var(--ink-3)}

  .pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pill-tabs button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer}
  .pill-tabs button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .photo-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .photo-preview{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .photo-row{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
  .photo-row-top{display:flex;align-items:center;gap:10px}
  .photo-row .pi-check{flex-shrink:0;width:16px;height:16px;accent-color:var(--accent)}
  .photo-row .main{flex:1;min-width:0}
  .photo-row .name{font-weight:700;font-size:14px}
  .photo-row .meta{color:var(--ink-3);font-size:12px;margin-top:2px}
  .photo-row .qty{width:88px;flex-shrink:0}
  .photo-row .qty label{display:block;font-size:10px;color:var(--ink-3);margin-bottom:2px}
  .photo-row .qty input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
  .photo-row .link-row{display:flex;align-items:center;gap:6px;padding-left:28px}
  .photo-row .link-row label{font-size:10px;color:var(--ink-3);white-space:nowrap;flex-shrink:0}
  .photo-row .link-row select{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:inherit}
  .cook-toggle{margin:0 0 0 28px;display:flex;gap:6px}
  .cook-toggle button{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer}
  .cook-toggle button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .ingredient-panel{margin-left:28px;border:1px dashed var(--border);border-radius:10px;padding:10px}
  .ingredient-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .ingredient-row:last-child{margin-bottom:0}
  .ingredient-row .ing-use{flex-shrink:0;width:15px;height:15px;accent-color:var(--accent)}
  .ingredient-row .ing-name{flex:1.2;min-width:80px;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:inherit}
  .ingredient-row .ing-qty{width:56px;flex-shrink:0;padding:5px 6px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-variant-numeric:tabular-nums;color:inherit}
  .ingredient-row .ing-unit{font-size:11px;color:var(--ink-3);flex-shrink:0}
  .ingredient-row .ing-link{flex:1.6;min-width:120px;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:inherit}
  .ingredient-row .ing-remove{flex-shrink:0;border:none;background:transparent;color:var(--ink-3);font-size:17px;line-height:1;cursor:pointer;padding:0 3px}
  .ingredient-row .ing-remove:hover{color:var(--crit)}
  .ing-add-btn{margin-top:2px}
  .receipt-row{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);margin-bottom:8px}
  .receipt-row-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .receipt-row-top .ri-use{flex-shrink:0;width:16px;height:16px;accent-color:var(--accent)}
  .receipt-row-top .ri-name{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:700;color:inherit}
  .receipt-row-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;padding-left:26px}
  .receipt-row-fields select,.receipt-row-fields input{padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:inherit}

  .totals-bar{display:flex;flex-wrap:wrap;gap:14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
  .totals-bar b{color:var(--ink);font-variant-numeric:tabular-nums}

  .disclaimer{font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--border);margin-top:16px;padding-top:12px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;display:flex;align-items:center;gap:6px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;flex-shrink:0}

  .quick-form{display:flex;gap:6px;margin-top:8px}
  .quick-form input{width:0;flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
  .quick-form input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .quick-form button{flex-shrink:0}
  .stat-tile .note{font-size:11px;color:var(--ink-3);margin-top:6px}

  .scanner-overlay{position:fixed;inset:0;background:rgba(20,18,12,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .scanner-overlay[hidden]{display:none}
  .scanner-box{background:var(--surface);border-radius:16px;padding:14px;max-width:440px;width:100%;box-shadow:var(--shadow)}
  .scanner-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .scanner-head span{font-weight:700;font-size:14px}
  .scanner-viewport{position:relative;width:100%;background:#111;border-radius:10px;overflow:hidden;line-height:0}
  .scanner-viewport video{width:100%;height:auto;display:block}
  .scanner-guide{position:absolute;top:8%;bottom:8%;left:38%;width:24%;border:2px solid rgba(255,255,255,.9);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
  .scanner-hint{font-size:12px;color:var(--ink-3);margin-top:8px;text-align:center}
  .barcode-note{font-size:11.5px;color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:2px}

  @media (max-width:600px){
    header.top{padding-top:20px}
    .app{padding-bottom:100px}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>NutriStock</h1>
      <span class="tagline">栄養バランス × 食材ロスゼロ</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="today" id="todayLabel"></div>
      <button type="button" id="themeToggleBtn" class="btn ghost small" title="ダークモード切替" style="font-size:16px;padding:4px 8px">🌙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active">ホーム</button>
    <button data-tab="pantry">パントリー<span class="tab-badge" id="pantryBadge" hidden>0</span></button>
    <button data-tab="meals">食事記録</button>
    <button data-tab="settings">設定</button>
  </nav>

  <!-- HOME -->
  <section class="panel active" data-panel="home" id="panel-home"></section>

  <!-- PANTRY -->
  <section class="panel" data-panel="pantry" id="panel-pantry"></section>

  <!-- MEALS -->
  <section class="panel" data-panel="meals" id="panel-meals"></section>

  <!-- SETTINGS -->
  <section class="panel" data-panel="settings" id="panel-settings"></section>
</div>

<div class="scanner-overlay" id="scannerOverlay" hidden>
  <div class="scanner-box">
    <div class="scanner-head"><span>バーコードをスキャン</span><span style="display:flex;gap:6px"><button type="button" id="scannerFlipBtn" class="btn ghost small" style="display:none">🔄 カメラ切替</button><button type="button" id="scannerClose" class="btn ghost small">閉じる</button></span></div>
    <div class="scanner-viewport"><video id="scannerVideo"></video><div class="scanner-guide"></div></div>
    <div class="scanner-hint" id="scannerHint">バーコードを縦向き(90度回転)にして枠に合わせてください。正面のままだと読み取れないことが多いです</div>
    <button type="button" id="scannerShareBtn" class="btn small" style="margin-top:10px;display:none">📤 画像を共有</button>
    <button type="button" id="scannerManualShareBtn" class="btn secondary small" style="margin-top:10px;display:none">📷 今の映像を保存（失敗中でもOK）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- food database (approx. per 100g, based on 日本食品標準成分表) ---------- */
var FOOD_DB = [
  {key:"chicken_breast",name:"鶏むね肉(皮なし)",cat:"meat",kcal:108,p:22.3,f:1.5,c:0.1,fiber:0,salt:0.1,veg:false,unit:"g"},
  {key:"chicken_thigh",name:"鶏もも肉(皮なし)",cat:"meat",kcal:113,p:19.0,f:5.0,c:0,fiber:0,salt:0.2,veg:false,unit:"g"},
  {key:"chicken_mince",name:"鶏ひき肉",cat:"meat",kcal:171,p:17.5,f:12.0,c:0,fiber:0,salt:0.1,veg:false,unit:"g"},
  {key:"pork_koma",name:"豚こま切れ肉",cat:"meat",kcal:221,p:17.7,f:15.1,c:0.1,fiber:0,salt:0.1,veg:false,unit:"g"},
  {key:"pork_loin",name:"豚ロース肉",cat:"meat",kcal:263,p:19.3,f:19.2,c:0.2,fiber:0,salt:0.1,veg:false,unit:"g"},
  {key:"beef_koma",name:"牛こま切れ肉",cat:"meat",kcal:249,p:17.4,f:18.6,c:0.5,fiber:0,salt:0.1,veg:false,unit:"g"},
  {key:"egg",name:"卵",cat:"egg_dairy",kcal:151,p:12.2,f:10.2,c:0.3,fiber:0,salt:0.4,veg:false,unit:"個"},
  {key:"milk",name:"牛乳",cat:"egg_dairy",kcal:61,p:3.3,f:3.8,c:4.8,fiber:0,salt:0.1,veg:false,unit:"ml"},
  {key:"yogurt",name:"ヨーグルト(無糖)",cat:"egg_dairy",kcal:56,p:3.6,f:3.0,c:4.9,fiber:0,salt:0.1,veg:false,unit:"個"},

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysUntil(dateStr){
  var today = new Date(todayStr()+"T00:00:00");
  var target = new Date(dateStr+"T00:00:00");
  return Math.round((target-today)/86400000);
}

/* ---------- persistence ---------- */
var hasUnsyncedLocalChange = false;
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function persist(fields){
  try{ localStorage.setItem("nutristock_state", JSON.stringify(state)); }catch(e){}
  if(fields) showToast("保存しました");
  if(!dbDoc){ hasUnsyncedLocalChange = true; return; }
  if(!fields || !dbReady){
    dbDoc.set(state).catch(function(){});
    hasUnsyncedLocalChange = false;
    return;
  }
  var patch = {};
  fields.forEach(function(k){ patch[k] = state[k]; });
  dbDoc.update(patch).catch(function(){ dbDoc.set(state).catch(function(){}); });
}
function loadLocal(){
  try{
    var raw = localStorage.getItem("nutristock_state");
    if(raw){ var parsed = JSON.parse(raw); if(parsed && typeof parsed==="object"){ state = Object.assign(defaultState(), parsed); } }
  }catch(e){}
}
async function initDb(){
  loadLocal();
  renderAll();
  try{
    var db = await claude.use("db");
    if(!db) return;
    dbDoc = db.doc("app/state");
    dbDoc.onSnapshot(function(snap){
      var firstDelivery = !dbReady;
      if(snap.exists){
        var data = snap.data();
        if(data && typeof data==="object"){
          if(firstDelivery && hasUnsyncedLocalChange){
            /* the viewer already changed something locally before the db connection finished —
               keep their edit and push it, rather than letting stale server data silently discard it */
            dbDoc.set(state).catch(function(){});
            hasUnsyncedLocalChange = false;
          } else {
            var incoming = JSON.stringify(data);
            if(incoming !== JSON.stringify(state)){
              state = Object.assign(defaultState(), deepClone(data));
              renderAll();
            }
          }
        }
      } else if(!dbReady){
        dbDoc.set(state).catch(function(){});
      }
      dbReady = true;
    }, function(){ /* degrade silently, keep local persistence */ });
  }catch(e){}
}

/* downscale to keep the base64 payload small (faster + cheaper); vision input doesn't need full resolution */
function fileToInlineImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxSide = 1024;
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxSide/Math.max(w,h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      c.getContext("2d").drawImage(img, 0, 0, cw, ch);
      var dataUrl = c.toDataURL("image/jpeg", 0.82);
      cb({ mimeType:"image/jpeg", data: dataUrl.split(",")[1] || "" });
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

function per100FromPhotoItem(it){
  var g = it.estimatedGrams>0 ? it.estimatedGrams : 0;
  function r(v){ return g>0 ? (Number(v)||0)/g*100 : 0; }
  return {kcal:r(it.kcal),p:r(it.protein),f:r(it.fat),c:r(it.carb),fiber:r(it.fiber),salt:r(it.salt)};
}
function nutrientsForPhotoItem(item, qty){
  var factor = qty/100;
  return {
    kcal: item.per100.kcal*factor, protein: item.per100.p*factor, fat: item.per100.f*factor,
    carb: item.per100.c*factor, fiber: item.per100.fiber*factor, salt: item.per100.salt*factor,
    veg: qty*item.vegRatio
  };
}
function escapeAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

var zxingLoading = null;
var scannerActive = false;
var pendingBarcode = null;
var pendingBarcodeNutrition = null; /* per-100g/ml nutrition fetched from Open Food Facts for pendingBarcode, if any */
var onBarcodeDetected = null; /* set by whoever opens the scanner */
var zxingReader = null;

/* free, no-key, CORS-open product database (see NOTES.md "バーコード→Open Food Facts栄養情報").
   Crowdsourced, so coverage for Japanese products is inconsistent — this is a "if it hits" bonus,
   not something to rely on; the existing manual-entry flow is always the fallback. Its per-100g
   fields (kcal/protein/fat/carb/fiber/salt) happen to already match NutriStock's own nutrient
   schema, so no unit conversion is needed — we just take Open Food Facts' fields as-is. */
async function lookupOpenFoodFacts(code){
  try{
    var res = await fetch(
      "https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) + ".json?fields=product_name,product_name_ja,nutriments"
    );
    if(!res.ok) return null;
    var data = await res.json();
    if(data.status !== 1 || !data.product) return null;
    var name = data.product.product_name_ja || data.product.product_name;
    if(!name) return null;
    var n = data.product.nutriments || {};
    return {
      name: String(name).slice(0,60),
      nutrition100: {
        kcal: Number(n["energy-kcal_100g"])||0,
        p: Number(n["proteins_100g"])||0,
        f: Number(n["fat_100g"])||0,
        c: Number(n["carbohydrates_100g"])||0,
        fiber: Number(n["fiber_100g"])||0,
        salt: Number(n["salt_100g"])||0
      }
    };
  }catch(e){ return null; }
}

function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(zxingLoading) return zxingLoading;
  zxingLoading = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js";
    s.onload = function(){ resolve(window.ZXing); };
    s.onerror = function(){ reject(new Error("load_failed")); };
    document.head.appendChild(s);
  });
  return zxingLoading;
}

function setScannerHint(msg){
  var h = document.getElementById("scannerHint");
  if(h) h.textContent = msg;
}

var preferredCameraId = null;
try{ preferredCameraId = localStorage.getItem("nutristock_cameraId") || null; }catch(e){}
var availableCameras = [];

function decodeResultCallback(ZXing){
  return function(result, err){
    if(!scannerActive) return;
    if(result){
      var fmt = result.getBarcodeFormat ? result.getBarcodeFormat() : null;
      if(fmt !== ZXing.BarcodeFormat.EAN_13){
        console.log("[NutriStock] EAN-13以外を検知したため無視:", fmt, result.getText());
        return; /* JANコード(EAN-13)以外は商品バーコードとして扱わない */
      }
      handleBarcodeDetected(result.getText());
      return;
    }
    /* err fires continuously while no barcode is in frame — expected, ignore it */
  };
}
async function startDecoding(ZXing){
  scannerActive = true;
  setScannerHint("カメラを起動しています…");
  zxingReader.decodeFromVideoDevice(
    preferredCameraId || undefined,
    "scannerVideo",
    decodeResultCallback(ZXing)
  ).then(function(){
    console.log("[NutriStock] カメラ起動成功、読み取り待機中…");
    setScannerHint("バーコードを縦向き(90度回転)にして枠に合わせてください。正面のままだと読み取れないことが多いです");
  }).catch(function(err){
    /* a cached camera id can go stale (Safari occasionally rotates device ids — after an
       OS/browser update, clearing site data, etc.) and getUserMedia throws OverconstrainedError
       since nothing matches that exact deviceId anymore. Forget it and retry once with the
       browser's own default camera before giving up. */
    if(err && err.name==="OverconstrainedError" && preferredCameraId){
      preferredCameraId = null;
      try{ localStorage.removeItem("nutristock_cameraId"); }catch(e){}
      zxingReader.decodeFromVideoDevice(undefined, "scannerVideo", decodeResultCallback(ZXing))
        .then(function(){
          console.log("[NutriStock] カメラIDを再検出して起動成功");
          setScannerHint("バーコードを縦向き(90度回転)にして枠に合わせてください。正面のままだと読み取れないことが多いです");
        })
        .catch(function(err2){
          var detail2 = err2 && (err2.name || err2.message) ? (err2.name||"")+" "+(err2.message||"") : "";
          setScannerHint("カメラを起動できませんでした。権限が許可されているか確認してください。" + (detail2 ? "（"+detail2+"）" : ""));
        });
      return;
    }
    var detail = err && (err.name || err.message) ? (err.name||"")+" "+(err.message||"") : "";
    setScannerHint("カメラを起動できませんでした。権限が許可されているか確認してください。" + (detail ? "（"+detail+"）" : ""));
  });
}

async function openScanner(onDetected){
  onBarcodeDetected = onDetected;
  var overlay = document.getElementById("scannerOverlay");
  overlay.hidden = false;
  lastSnapshotFile = null;
  lastSnapshotCode = null;
  document.getElementById("scannerShareBtn").style.display = "none";
  document.getElementById("scannerManualShareBtn").style.display = DEBUG_MODE ? "" : "none";
  setScannerHint("カメラを起動しています…");
  try{
    var ZXing = await loadZXing();
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingReader = new ZXing.BrowserMultiFormatReader(hints);

    try{
      availableCameras = await zxingReader.listVideoInputDevices();
      document.getElementById("scannerFlipBtn").style.display = availableCameras.length > 1 ? "" : "none";
      /* the cached camera id can go stale (see startDecoding) — drop it up front if it no
         longer matches a real device, instead of only reacting after getUserMedia rejects it */
      if(preferredCameraId && !availableCameras.some(function(d){ return d.deviceId===preferredCameraId; })){
        preferredCameraId = null;
        try{ localStorage.removeItem("nutristock_cameraId"); }catch(e){}
      }
      if(!preferredCameraId){

     enough in practice that requiring a second consecutive match made real reads almost

/* shared by every feature that asks Gemini for a JSON array (photo analysis, AI meal
   suggestions): strips a ```...``` code fence if present and normalizes to an array. */
function parseGeminiJsonArray(text){
  var cleaned = String(text||"").trim().replace(/^```[a-zA-Z]*\n?/,"").replace(/```\s*$/,"").trim();
  var parsed = JSON.parse(cleaned);
  return Array.isArray(parsed) ? parsed : (parsed && typeof parsed==="object" ? [parsed] : []);
}

function geminiPhotoItemsFromResponseText(text, validPantryIds){

    var estimatedGrams = Number(it.estimatedGrams)||0;
    var vegetableGrams = Number(it.vegetableGrams)||0;
    var ingredients = (Array.isArray(it.ingredients) ? it.ingredients : []).slice(0,8).map(function(ing){
      var matchedPantryId = ing.matchedPantryId && validPantryIds.indexOf(ing.matchedPantryId)>=0 ? ing.matchedPantryId : null;
      return {
        name: String(ing.name||"").slice(0,40),

        matchedPantryId: matchedPantryId
      };
    });
    var item = {

/* shared low-level caller for every Gemini text/vision request in the app (photo analysis,
   icon guessing, meal suggestions, recipe lookup). Centralizes the retry-on-503 + hard-timeout
   + error-code mapping logic that would otherwise be copy-pasted at every call site (it already
   was, twice, before this refactor — see NOTES.md). opts.tools passes through to the request
   verbatim (e.g. [{googleSearch:{}}]) for callers that need grounding. Returns
   { ok:true, text, groundingMetadata } or { ok:false, code }. */
async function callGeminiText(promptText, opts){
  opts = opts || {};
  if(!hasGeminiKey()) return { ok:false, code:"invalid_key" };
  var geminiUrl = "https://generativelanguage.googleapis.com/v1beta/models/" + geminiModel + ":generateContent";
  var parts = [{ text: promptText }];
  if(opts.image) parts.push({ inlineData: { mimeType: opts.image.mimeType, data: opts.image.data } });
  var requestBody = JSON.stringify({
    contents: [{ parts: parts }],
    generationConfig: { maxOutputTokens: opts.maxOutputTokens || 1024 },
    tools: opts.tools || undefined
  });
  var res = null;
  var timedOut = false;
  var attempts = opts.noRetry ? 1 : 2;
  /* Gemini's free/flash tier returns 503 fairly often under load, and observed in practice
     to sometimes hang over a minute before even returning that 503 — so each attempt gets
     a hard timeout rather than letting the viewer stare at a loading state for minutes */
  for(var attempt=0; attempt<attempts; attempt++){
    timedOut = false;
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ timedOut = true; controller.abort(); }, opts.timeoutMs || 25000);
    try{
      res = await fetch(geminiUrl, {
        method: "POST",
        headers: { "content-type": "application/json", "x-goog-api-key": geminiApiKey },
        body: requestBody,
        signal: controller.signal
      });
    }catch(fetchErr){
      res = null;
    }
    clearTimeout(timeoutId);
    if(res && (res.ok || (res.status!==503 && res.status!==500))) break;
    if(attempt < attempts-1) await new Promise(function(r){ setTimeout(r, 1500); });
  }
  if(!res || !res.ok){
    var errBody = res ? await res.json().catch(function(){ return null; }) : null;
    var errStatus = errBody && errBody.error && errBody.error.status;
    var errReason = errBody && errBody.error && errBody.error.details && errBody.error.details[0] && errBody.error.details[0].reason;
    var code = timedOut ? "server_overloaded"
      : !res ? "network_error"
      : (errReason==="API_KEY_INVALID" || res.status===401 || res.status===403 || errStatus==="PERMISSION_DENIED") ? "invalid_key"
      : (res.status===429 || errStatus==="RESOURCE_EXHAUSTED") ? "rate_limited"
      : (res.status===503 || res.status===500 || errStatus==="UNAVAILABLE") ? "server_overloaded"
      : "network_error";
    logGeminiUsage({ ts: Date.now(), model: geminiModel, ok: false, code: code });
    return { ok:false, code: code };
  }
  var data = await res.json();
  var text = "";
  var candidate = data.candidates && data.candidates[0];
  var cParts = candidate && candidate.content && candidate.content.parts;
  (cParts||[]).forEach(function(part){ if(part.text) text += part.text; });
  var usage = data.usageMetadata || {};
  logGeminiUsage({ ts: Date.now(), model: geminiModel, ok: true, promptTokens: usage.promptTokenCount||0, outputTokens: usage.candidatesTokenCount||0 });
  return { ok:true, text: text, groundingMetadata: candidate && candidate.groundingMetadata };
}

/* Pollinations.ai (https://pollinations.ai) — free, no API key, no signup, CORS-open.
   Confirmed by hand: the default model ("sana") occasionally 429s under shared community
   load, but model=flux was reliable across repeated tests, so it's hardcoded here rather
   than left to the service default. One retry covers the rest of that occasional flakiness.
   Unlike everything else under "AI", this doesn't touch Gemini at all — no key needed,
   nothing to log to the Gemini usage panel. */

/* Best-effort, non-blocking congestion check (added 2026-09-19, user's idea: know it's
   congested before trying instead of after several failures). Pollinations publishes its
   own cached (~60s TTL per its Cache-Control header, confirmed live) status feed at
   gen.pollinations.ai/models/status — no auth, CORS-open. We look up "lykon/dreamshaper-8-lcm"
   specifically: that's not documented anywhere as "the model behind the free image
   endpoint" — it's what our OWN captured error payloads showed the anonymous "sana" alias
   actually routes to (image.pollinations.ai/models currently lists only "sana" — flux isn't
   even offered on this endpoint right now, unrelated to congestion). If Pollinations changes
   that routing again this lookup will just silently stop matching (falls through to null,
   no warning shown) — there's no API that documents the mapping, so it would need
   re-deriving from a fresh error payload. Any failure here (network, shape change, timeout)
   fails open: returns null, and the caller just skips the warning rather than blocking
   generation on a health check that itself couldn't be confirmed. */
async function checkPollinationsHealth(){
  console.log("[NutriStock] 混雑チェック: 開始 "+new Date().toISOString());
  try{
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 5000);
    var res = await fetch("https://gen.pollinations.ai/models/status", { signal: controller.signal });
    clearTimeout(timeoutId);
    if(!res.ok){
      console.log("[NutriStock] 混雑チェック: レスポンスNG", res.status, new Date().toISOString());
      return null;
    }
    var data = await res.json();
    var row = (data.data || []).find(function(r){
      return r.model === "lykon/dreamshaper-8-lcm" && r.is_rollup === 0;
    });
    if(!row || !row.total_requests){
      console.log("[NutriStock] 混雑チェック: 対象モデルの行が見つからず", new Date().toISOString());
      return null;
    }
    var result = { successRate: row.status_2xx / row.total_requests, totalRequests: row.total_requests };
    console.log("[NutriStock] 混雑チェック: 完了 成功率="+Math.round(result.successRate*100)+"% (total_requests="+result.totalRequests+") "+new Date().toISOString());
    return result;
  }catch(e){
    console.log("[NutriStock] 混雑チェック: fetch自体が失敗", e, new Date().toISOString());
    return null;
  }
}

/* Keeps the congestion banner live while suggestions with imageGenEnabled are on screen
   (added 2026-09-19, user asked for real-time updates instead of a one-off check). Polls
   every 60s — matching the status feed's own Cache-Control max-age, so polling faster would
   just re-fetch the same cached snapshot. Skips the actual fetch while the tab/screen is
   backgrounded (document.hidden) to avoid spending battery/data on a check nobody can see.
   Always stopped and restarted together as a pair — see call sites in runAiSuggestions. */
var pollinationsHealthTimer = null;
function startPollinationsHealthPolling(){
  stopPollinationsHealthPolling();
  console.log("[NutriStock] 混雑チェック: ポーリング開始（60秒ごと） "+new Date().toISOString());
  pollinationsHealthTimer = setInterval(function(){
    if(document.hidden){
      console.log("[NutriStock] 混雑チェック: 画面非表示のためスキップ "+new Date().toISOString());
      return;
    }
    checkPollinationsHealth().then(function(h){ aiSuggestUi.pollinationsHealth = h; renderHome(); });
  }, 60000);
}
function stopPollinationsHealthPolling(){
  if(pollinationsHealthTimer){
    clearInterval(pollinationsHealthTimer);
    pollinationsHealthTimer = null;
    console.log("[NutriStock] 混雑チェック: ポーリング停止 "+new Date().toISOString());
  }
}

async function generateDishImageDataUrl(promptText){
  /* Pollinations returns the exact same image for the exact same prompt when no seed is
     given (confirmed live: identical bytes on repeated identical requests) — without this,
     tapping "🎨 再生成" would silently hand back the same picture every time */
  var seed = Math.floor(Math.random()*1000000);
  var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(promptText)
    + "?width=768&height=768&nologo=true&model=flux&referrer=nutristock&seed=" + seed;
  /* Single attempt, no automatic retry (removed 2026-09-19). Real error payloads captured
     from the app showed that when a request times out client-side (our own AbortController
     firing), Pollinations' server doesn't actually free the per-IP "1 in-flight" slot just
     because we gave up waiting — the aborted job is still occupying it. So an immediate
     retry doesn't get a fresh attempt, it just bounces off the same still-occupied slot
     with an instant 429 "Queue full" — confirmed in every retry seen in testing, none
     succeeded. Retrying was pure wasted time (up to another ~21.5s) for a near-guaranteed
     failure. The manual "🎨 再試行" button on each dish remains as the real retry path —
     tapping it later gives the stuck slot actual time to clear. */
  try{
    var controller = new AbortController();
    /* Default 90s, confirmed correct by measurement (2026-09-19, real timestamped logs, not
       assumption): raised from 20s to test whether a "stuck" (no response at all) request
       would ever actually complete given enough time. It does — one observed dish took
       ~32.6s and succeeded, which the old 20s cutoff would have killed and reported as a
       failure. Only viable because generation is manual/one-at-a-time (see NOTES.md) — a
       single click occasionally waiting up to 90s is an acceptable cost that a 4-dish
       automatic burst never was. Made user-configurable (settings tab) since there's no
       single right answer: longer risks the UI looking permanently stuck if Pollinations
       truly never responds to a lost job; shorter risks aborting a request that was
       genuinely about to succeed. Never fully unbounded — an infinite wait with no way to
       fail and show a retry button would be worse than either tradeoff. */
    var timeoutId = setTimeout(function(){ controller.abort(); }, pollinationsTimeoutSec*1000);
    var res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if(res.ok){
      var blob = await res.blob();
      return await new Promise(function(resolve){
        var reader = new FileReader();
        reader.onload = function(){ resolve(reader.result); };
        reader.onerror = function(){ resolve(null); };
        reader.readAsDataURL(blob);
      });
    }
    var errBody = await res.text().catch(function(){ return ""; });
    console.log("[NutriStock] 画像生成(Pollinations): レスポンスNG", res.status, errBody);
  }catch(e){
    console.log("[NutriStock] 画像生成(Pollinations): fetch自体が失敗", e);
  }
  return null;
}

    + JSON.stringify(pantryContext);

  var result = await callGeminiText(prompt, { maxOutputTokens: 1024 });
  if(!result.ok){
    photoUi.status = "error"; photoUi.error = PHOTO_ERROR_MESSAGES[result.code] || PHOTO_ERROR_MESSAGES.network_error; renderMeals(); return;
  }
  try{
    var validPantryIds = state.pantry.map(function(p){ return p.id; });
    photoUi.items = geminiPhotoItemsFromResponseText(result.text, validPantryIds);
    photoUi.status = photoUi.items.length ? "done" : "error";
    if(!photoUi.items.length) photoUi.error = "料理を認識できませんでした。もう一度お試しください。";
  }catch(e){
    photoUi.status = "error";
    photoUi.error = PHOTO_ERROR_MESSAGES.invalid_json;
  }
  renderMeals();
}

function startVoiceRecording(){
  if(!SpeechRecognitionCtor || voiceUi.listening) return;
  var recognition = new SpeechRecognitionCtor();
  recognition.lang = "ja-JP";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  voiceUi.listening = true;
  var btn = document.getElementById("voiceRecordBtn");
  if(btn){ btn.textContent = "🎙️ 聞き取り中…（話し終えたら自動で止まります）"; btn.disabled = true; }
  recognition.onresult = function(e){
    var transcript = e.results[0][0].transcript;
    voiceUi.listening = false;
    runVoiceAnalysis(transcript);
  };
  recognition.onerror = function(e){
    voiceUi.listening = false;
    photoUi.status = "error";
    photoUi.error = e && e.error==="not-allowed" ? "マイクの権限が許可されていません。" : "音声を認識できませんでした。もう一度お試しください。";
    renderMeals();
  };
  recognition.onend = function(){
    voiceUi.listening = false;
    var b = document.getElementById("voiceRecordBtn");
    if(b && photoUi.status!=="loading"){ b.textContent = "🎤 音声で記録"; b.disabled = false; }
  };
  try{ recognition.start(); }catch(e){ voiceUi.listening = false; }
}

/* best-effort emoji icon for pantry items that have no FOOD_DB match (barcode/custom entries).
   Fire-and-forget: the item is already saved and rendered with the category fallback icon
   before this resolves, so failure/no-key here is silent and never blocks the pantry add. */
async function guessFoodIcon(name){
  if(!hasGeminiKey() || !name) return null;
  var result = await callGeminiText(
    "次の食品を最もよく表す絵文字を1つだけ選び、絵文字1文字だけを返してください。説明文・記号・引用符は一切付けないでください。食品名: " + name,
    { maxOutputTokens: 20, noRetry: true }
  );
  if(!result.ok) return null;
  var candidate = result.text.trim().split(/\s+/)[0] || "";
  /* reject anything that isn't a short, letter/digit-free reply — a real answer here is
     one emoji; longer text usually means the model added an explanation we can't use */
  if(candidate && candidate.length<=8 && !/[a-zA-Z0-9]/.test(candidate)) return candidate;
  return null;
}

/* App-wide serialization queue for Pollinations requests. Pollinations enforces "max 1
   in-flight request per IP" (see NOTES.md) — the automatic per-dish loop already awaits
   each dish in turn, but that alone doesn't stop a manual "🎨 再試行" tap on a DIFFERENT
   dish from firing while the auto loop is still mid-flight on another one, which would
   genuinely violate the same-IP concurrency limit and trigger the same "Queue full" 429.
   Routing every call through this single chained promise makes the whole app — auto loop
   and manual button alike — share one strict FIFO queue, so at most one Pollinations
   request is ever in flight no matter where it was triggered from. */
var pollinationsQueue = Promise.resolve();
function runQueuedPollinationsRequest(fn){
  var run = pollinationsQueue.then(fn, fn);
  pollinationsQueue = run.then(function(){}, function(){});
  return run;
}

/* Bounded retry-with-backoff (added 2026-09-19, user's compromise idea): instead of retrying
   forever until success — which would hide how long it's actually taking and, worse, would
   mean hammering a free shared community resource with automated repeat requests whenever
   ① (the shared per-minute rate limit) is the cause, which is bad citizenship on a free
   service and something most APIs would consider abuse — try up to 3 times total, waiting
   30s between attempts. 30s is deliberately long: fast retries right after a failure were
   already shown to just bounce off the still-occupied per-IP slot from ②/③ (see NOTES.md);
   a real gap gives that slot an actual chance to clear. The user keeps full visibility (the
   congestion banner stays, and the loading hint below shows which attempt this is) rather
   than the app silently spinning with no explanation for minutes. */
var POLLINATIONS_MAX_ATTEMPTS = 3;
var POLLINATIONS_RETRY_DELAY_SEC = 30;

/* Called both automatically for every dish (see generateAllSuggestedDishImages, run right
   after a suggestion batch loads when imageGenEnabled) and by the manual "🎨 画像を生成" /
   "🔄 別の画像に" / "🎨 再試行" button on a single dish (see imageBtn markup in renderHome).
   Auto-generation was tried, reverted, then re-enabled once this function grew bounded
   per-attempt retries with real spacing — see NOTES.md for the full history. Pollinations.ai
   is free and doesn't touch the Gemini quota either way. */
async function generateImageForSuggestedDish(idx){
  var d = aiSuggestUi.dishes[idx];
  if(!d || d.imageLoading) return;
  d.imageLoading = true;
  d.imageAttemptNum = 1;
  renderHome();
  /* Flux (the model behind Pollinations.ai) is trained mostly on English captions and
     largely ignores a Japanese dish name — tested live, two completely different dishes
     ("肉じゃが" vs "オムライス") with only the name swapped in an otherwise-identical
     English template came back as near-identical generic bowls, neither resembling the
     actual dish. Gemini (which already wrote the suggestion) is asked for an English
     visual description (imagePromptEn) precisely so Flux has real content to draw from;
     the bare-name template is only a fallback for older favorites saved before this field
     existed. */
  var visual = d.imagePromptEn || ("a Japanese home-cooked dish called \""+d.name+"\"");
  var prompt = "A professional, appetizing food photograph of " + visual + ", beautifully plated on a clean dinner table, natural lighting, realistic food photography style, no text or logos in the image.";
  var url = null;
  for(var attempt=1; attempt<=POLLINATIONS_MAX_ATTEMPTS; attempt++){
    d.imageAttemptNum = attempt;
    if(attempt>1) renderHome();
    /* Timestamped start/end markers (added 2026-09-19) so the queue's non-overlap claim can
       be checked directly from a pasted console log instead of taken on faith: "投入" is
       just when this dish entered the queue (can legitimately overlap with others waiting
       their turn), but "実行開始"→"実行終了" brackets the actual fetch() — if the
       serialization is working, no two dishes' 実行開始/実行終了 windows should ever
       overlap in the timestamps. */
    console.log("[NutriStock] 画像生成: キュー投入 idx="+idx+" 試行"+attempt+"/"+POLLINATIONS_MAX_ATTEMPTS+" "+new Date().toISOString());
    url = await runQueuedPollinationsRequest(function(){
      console.log("[NutriStock] 画像生成: 実行開始 idx="+idx+" "+new Date().toISOString());
      return generateDishImageDataUrl(prompt).then(function(u){
        console.log("[NutriStock] 画像生成: 実行終了 idx="+idx+" "+new Date().toISOString()+" 結果="+(u?"成功":"失敗"));
        return u;
      });
    });
    if(url) break;
    if(attempt < POLLINATIONS_MAX_ATTEMPTS){
      console.log("[NutriStock] 画像生成: "+POLLINATIONS_RETRY_DELAY_SEC+"秒待って再試行 idx="+idx+" "+new Date().toISOString());
      await new Promise(function(r){ setTimeout(r, POLLINATIONS_RETRY_DELAY_SEC*1000); });
    }
  }
  d.imageLoading = false;
  d.imageDataUrl = url;
  d.imageAttempted = true;
  renderHome();
}

/* Re-enabled 2026-09-19 (second time — see NOTES.md for the full back-and-forth) now that
   generateImageForSuggestedDish has bounded per-dish retries with backoff. The original
   auto-batch failure mode was: dish 1 succeeds fast, dish 2's first attempt hangs, dishes
   3/4 fire immediately after and bounce off the still-occupied per-IP slot. Per-dish retry
   alone doesn't fix that — it would still happen on every dish's FIRST attempt, since
   nothing paced the transition FROM one dish's success straight INTO the next dish's first
   attempt. So this loop also waits POLLINATIONS_RETRY_DELAY_SEC between dishes (not just
   between retries within a dish) — same constant, same reasoning: give any slot left
   occupied by the previous dish real time to clear before the next dish's first attempt,
   even when that previous dish appeared to succeed. Real error payloads earlier also showed
   Pollinations enforces a hard "max 1 in-flight request per IP" queue (`"message":"Queue
   full for IP: ...: 1 requests already queued (max: 1)"`) — firing all dishes via
   Promise.all was tried and reverted for that reason; this stays sequential. */
async function generateAllSuggestedDishImages(){
  var dishes = aiSuggestUi.dishes;
  for(var i=0;i<dishes.length;i++){
    if(aiSuggestUi.dishes !== dishes) return;
    /* Only pause before the next dish if the previous one never actually succeeded
       (2026-09-19, user's observation — confirmed by real logs showing the wait didn't
       prevent anything). A clean 200 OK means Pollinations already fully finished and
       released whatever it was holding; the "give the slot time to clear" reasoning only
       applies to a request WE gave up on (timeout/abort) while the server may still have
       been working on it. There's no equivalent zombie-slot risk after a real success. */
    if(i>0 && !dishes[i-1].imageDataUrl) await new Promise(function(r){ setTimeout(r, POLLINATIONS_RETRY_DELAY_SEC*1000); });
    if(aiSuggestUi.dishes !== dishes) return;
    await generateImageForSuggestedDish(i);
  }
}

    : '<div class="hint" style="margin-top:4px">※実際のレシピサイトが見つからなかったため、AIが一般的な知識から作成した手順です（特定サイトからの引用ではありません）</div>';

/* button-triggered only, same "never automatic" policy as image generation. Uses Google
   Search grounding (tools:[{googleSearch:{}}]) so Gemini can find a real published recipe
   (クラシル等) instead of relying on its own memorized/possibly-wrong knowledge of the dish.
   Whether to label the result "web" vs "ai_generated" is decided from the response's actual
   groundingMetadata, never from what the model claims in its own JSON — a model asked to
   self-report whether it searched is exactly the kind of claim that can't be trusted; the
   grounding metadata is a separate, structurally distinct field Google populates only when
   a real search genuinely ran. */
async function fetchRecipeForDish(source, idx){
  var d = source==="fav" ? state.favoriteDishes[idx] : aiSuggestUi.dishes[idx];
  if(!d || (d.recipe && d.recipe.status==="loading")) return;
  d.recipe = { status:"loading", steps:[], source:null, error:"" };
  renderHome();
  var prompt = "「"+d.name+"」という料理の作り方の手順を、日本語の箇条書きで教えてください。可能であればWeb検索でクラシル(kurashiru.com)等の実際に公開されているレシピサイトを参照し、その手順をできるだけ反映してください。参考になる情報が見つからない場合は、一般的な家庭料理の知識をもとに手順を考えてください。\n"
    + "次のJSON形式のみで回答してください。前後の説明文やマークダウンのコードブロックは書かないでください。\n"
    + '{"steps":["手順1の説明文","手順2の説明文","手順3の説明文", ...]}';
  var result = await callGeminiText(prompt, { maxOutputTokens: 1200, tools: [{googleSearch:{}}] });
  var usedSearch = true;
  if(!result.ok && (result.code==="rate_limited" || result.code==="server_overloaded")){
    /* Google Search grounding has its own, much smaller quota, entirely separate from plain
       text generation — hitting it doesn't mean the API key or model is unusable, only that
       this one capability is temporarily out. Retry the same question without the tool so
       the viewer still gets a usable, honestly-labeled AI-generated recipe instead of a hard
       failure. Never retried for invalid_key — a bad key won't be fixed by dropping a tool. */
    usedSearch = false;
    result = await callGeminiText(prompt, { maxOutputTokens: 1200 });
  }
  if(!result.ok){
    d.recipe = { status:"error", steps:[], source:null, error: PHOTO_ERROR_MESSAGES[result.code] || PHOTO_ERROR_MESSAGES.network_error };
    renderHome();
    return;
  }
  try{
    var cleaned = result.text.trim().replace(/^```[a-zA-Z]*\n?/,"").replace(/```\s*$/,"").trim();
    var parsed = JSON.parse(cleaned);
    var steps = Array.isArray(parsed.steps) ? parsed.steps.slice(0,15).map(function(s){ return String(s).slice(0,200); }).filter(Boolean) : [];
    var chunks = (usedSearch && result.groundingMetadata && result.groundingMetadata.groundingChunks) || [];
    var firstSource = chunks.find(function(c){ return c.web && c.web.uri; });
    d.recipe = {
      status: steps.length ? "done" : "error",
      steps: steps,
      source: firstSource ? { type:"web", name: firstSource.web.title||"", url: firstSource.web.uri } : { type:"ai_generated" },
      error: steps.length ? "" : "レシピを取得できませんでした。もう一度お試しください。"
    };
  }catch(e){
    d.recipe = { status:"error", steps:[], source:null, error: PHOTO_ERROR_MESSAGES.invalid_json };
  }
  renderHome();
}

async function runAiSuggestions(){
  stopPollinationsHealthPolling();
  if(!hasGeminiKey()){
    aiSuggestUi.status = "error";
    aiSuggestUi.error = "設定タブでGemini APIキーを登録してください。";

  }

    aiSuggestUi.error = "パントリーに食材が登録されていません。まずは在庫を登録してください。";
    renderHome();
    return;
  }
  aiSuggestUi.status = "loading"; aiSuggestUi.dishes = []; aiSuggestUi.error = ""; aiSuggestUi.pollinationsHealth = null; aiSuggestUi.imageGenBatchInProgress = false;
  renderHome();
  var pantrySorted = state.pantry.slice().sort(function(a,b){ return daysUntil(a.expiry)-daysUntil(b.expiry); });
  var pantryContext = pantrySorted.map(function(p){ return { id:p.id, name:p.name, qty:p.qty, unit:p.unit, daysUntilExpiry: daysUntil(p.expiry) }; });
  var prompt = "あなたは家庭料理のアドバイザー兼栄養士です。ユーザーの現在の食材在庫（パントリー）は次の通りです（daysUntilExpiryが小さいほど賞味期限が近く、優先的に使うべき食材です）。\n"
    + JSON.stringify(pantryContext) + "\n"
    + "この在庫を使って作れる具体的な料理を最大4つ提案してください。特に賞味期限が近い食材を優先的に使う組み合わせを考えてください。\n"
    + "各料理について、一般的な1人前の総量を推定して栄養価を概算するとともに、実際にその料理を作るのに必要な主要な材料（調味料も含めてよい）を挙げ、それぞれが上記在庫の中にあるかどうか判定してください。\n"
    + "次のJSON配列の形式だけで回答してください。前後の説明文やマークダウンのコードブロックは一切書かないでください。\n"
    + '[{"name":"料理名(日本語、具体的に)","reason":"この料理を勧める理由(短く。特にどの食材をなぜ使うか)","estimatedGrams":料理全体の推定総重量(g),"kcal":その総量あたりのエネルギー(kcal),"protein":たんぱく質(g),"fat":脂質(g),"carb":炭水化物(g),"fiber":食物繊維(g),"salt":食塩相当量(g),"vegetableGrams":このうち野菜由来の重量(g。野菜でなければ0),"ingredients":[{"name":"材料名(日本語)","estimatedGrams":想定使用量(g),"matchedPantryId":上記在庫リストの中で対応するものがあればそのid(文字列)、無ければnull}],"imagePromptEn":"この料理の見た目を英語で具体的に説明する一文(画像生成AIへの指示文として使うため、料理名の日本語表記には頼らないこと)。最重要: 直前のingredientsで列挙した具体的な材料が画像にもそのまま写っていることが伝わるように、それぞれの色・形・切り方を明示して書くこと(一般的なその料理のイメージではなく、今回のingredientsの内容そのものを描写する)。例えば具材が鶏肉と大根なら、鶏肉や大根が実際に見えるように書き、無関係な具材を想像で足さないこと。例:\"a bowl of simmered chicken and daikon radish in soy sauce, tender chicken pieces, translucent white daikon chunks, glossy brown broth, dark ceramic bowl\")"}]\n'
    + "数値はすべて概算で構いません。在庫だけで無理に完結させず、一般的なレシピとして自然な材料を挙げてください（在庫に無い調味料等が混ざるのは自然です）。ただし主役の食材はできるだけ在庫にあるものを使ってください。imagePromptEnは必ずingredientsに列挙した材料と一致させ、そこに無い食材を描写に含めないでください。";

  var result = await callGeminiText(prompt, { maxOutputTokens: 1500 });
  if(!result.ok){
    aiSuggestUi.status = "error";
    aiSuggestUi.error = PHOTO_ERROR_MESSAGES[result.code] || PHOTO_ERROR_MESSAGES.network_error;
    renderHome();
    return;
  }
  try{
    var validPantryIds = state.pantry.map(function(p){ return p.id; });
    aiSuggestUi.dishes = geminiPhotoItemsFromResponseText(result.text, validPantryIds);
    aiSuggestUi.status = aiSuggestUi.dishes.length ? "done" : "error";
    if(!aiSuggestUi.dishes.length) aiSuggestUi.error = "提案を作成できませんでした。もう一度お試しください。";
  }catch(e){
    aiSuggestUi.status = "error";
    aiSuggestUi.error = PHOTO_ERROR_MESSAGES.invalid_json;
  }
  renderHome();
  if(imageGenEnabled && aiSuggestUi.dishes.length){
    /* Auto-generation was reverted, then re-enabled a second time 2026-09-19 (see NOTES.md
       for the full back-and-forth) once generateImageForSuggestedDish grew bounded retries
       with real spacing between attempts AND between dishes — that spacing is what the
       first attempt at auto-generation was missing, not automation itself. */
    aiSuggestUi.imageGenBatchInProgress = true;
    var batchDishes = aiSuggestUi.dishes;
    generateAllSuggestedDishImages().then(function(){
      /* Guard against a stale callback from an abandoned batch (user hit "AIに提案してもらう"
         again) clobbering the NEW batch's in-progress flag — only clear it if this callback
         still belongs to the batch that's actually current. */
      if(aiSuggestUi.dishes === batchDishes){ aiSuggestUi.imageGenBatchInProgress = false; renderHome(); }
    });
    checkPollinationsHealth().then(function(h){ aiSuggestUi.pollinationsHealth = h; renderHome(); });
    startPollinationsHealthPolling();
  }
}

    +   '<input type="date" class="ri-expiry" value="'+it.expiry+'">'
    + '</div>'
    + '</div>';
}

/* AI reads a photographed receipt and lists the food items on it, guessing a category,
   a household-scale quantity/unit, and an expiry date from typical shelf life — all
   editable before the viewer actually adds them to the pantry. */
async function runReceiptAnalysis(file){
  if(!hasGeminiKey()){
    receiptUi.status = "error";
    receiptUi.error = "設定タブでGemini APIキーを登録してください。";
    renderPantry();
    return;
  }
  receiptUi.status = "loading"; receiptUi.items = []; receiptUi.error = "";
  renderPantry();
  var prompt = "あなたはスーパーのレシートを読み取るアシスタントです。添付したレシート画像から、購入した食品だけを最大20件までリストアップしてください。税金・割引・ポイント・レジ袋・非食品などの行は無視してください。\n"
    + "次のJSON配列の形式だけで回答してください。前後の説明文やマークダウンのコードブロックは一切書かないでください。\n"
    + '[{"name":"商品名(日本語。レシートの表記を分かりやすく整えてよい)","category":"次のいずれか: meat,fish,egg_dairy,soy,veg,grain,fruit,season,other","estimatedQty":一般的な家庭用の数量(数値),"unit":"g,ml,個,パック,本,枚のいずれか","expiryDays":この食品の一般的な賞味/消費期限までの目安日数(整数)}]\n'
    + "数量・単位は実用的な形にしてください（例：卵はパック単位で1、鶏肉は推定グラム数など）。";

  fileToInlineImage(file, async function(imgSource){
    if(!imgSource || !imgSource.data){
      receiptUi.status = "error"; receiptUi.error = PHOTO_ERROR_MESSAGES.read_failed; renderPantry(); return;
    }
    var result = await callGeminiText(prompt, { image: imgSource, maxOutputTokens: 2000 });
    if(!result.ok){
      receiptUi.status = "error"; receiptUi.error = PHOTO_ERROR_MESSAGES[result.code] || PHOTO_ERROR_MESSAGES.network_error; renderPantry(); return;
    }
    try{
      var arr = parseGeminiJsonArray(result.text);
      receiptUi.items = arr.slice(0,20).map(function(it){
        var cat = CAT_LABEL[it.category] ? it.category : "other";
        var unit = RECEIPT_VALID_UNITS.indexOf(it.unit)>=0 ? it.unit : "個";
        var expiryDays = Number(it.expiryDays);
        if(!isFinite(expiryDays) || expiryDays<0) expiryDays = 4;
        var expiryDate = new Date(Date.now() + expiryDays*86400000);
        var expiry = expiryDate.getFullYear()+"-"+String(expiryDate.getMonth()+1).padStart(2,"0")+"-"+String(expiryDate.getDate()).padStart(2,"0");
        return {
          name: String(it.name||"").slice(0,40),
          category: cat,
          qty: Number(it.estimatedQty)>0 ? Number(it.estimatedQty) : 1,
          unit: unit,
          expiry: expiry
        };
      }).filter(function(it){ return it.name; });
      receiptUi.status = receiptUi.items.length ? "done" : "error";
      if(!receiptUi.items.length) receiptUi.error = "商品を認識できませんでした。もう一度お試しください。";
    }catch(e){
      receiptUi.status = "error";
      receiptUi.error = PHOTO_ERROR_MESSAGES.invalid_json;
    }
    renderPantry();
  });
}

/* ---------- targets ---------- */
function calcTargets(profile){
  var bmr = profile.sex==="male"
    ? 10*profile.weight + 6.25*profile.height - 5*profile.age + 5
    : 10*profile.weight + 6.25*profile.height - 5*profile.age - 161;
  var kcal = Math.round(bmr*profile.activity);
  var protein = Math.round(profile.weight*profile.proteinPerKg);
  var fat = Math.round(kcal*0.25/9);
  var carb = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  var fiber = profile.sex==="male" ? 21 : 18;
  var salt = profile.sex==="male" ? 7.5 : 6.5;
  return {kcal:kcal, protein:protein, fat:fat, carb:carb, fiber:fiber, salt:salt, veg:350};
}

/* recent weight-change trend, for display only — targets are recalculated from the latest
   logged weight (calcTargets), not from this trend, so there's no invented "adaptive macro"
   formula here, just an honest before/after comparison over whatever history exists */
function weightTrend(){
  var dates = Object.keys(state.weights||{}).sort();
  if(dates.length < 2) return null;
  var latestDate = dates[dates.length - 1];
  var latest = state.weights[latestDate];
  var cutoff = new Date(latestDate+"T00:00:00").getTime() - 7*86400000;
  var past = null, pastDate = null;
  for(var i=0;i<dates.length;i++){
    if(new Date(dates[i]+"T00:00:00").getTime() <= cutoff){ pastDate = dates[i]; past = state.weights[dates[i]]; }
  }
  if(past===null){ pastDate = dates[0]; past = state.weights[pastDate]; }
  if(pastDate===latestDate) return null;
  var days = Math.round((new Date(latestDate+"T00:00:00") - new Date(pastDate+"T00:00:00"))/86400000);
  return { latest: latest, delta: round1(latest-past), days: days };
}

/* ---------- nutrient totals ---------- */
function nutrientsForFood(food, qty){
  var factor = qty/100;
  return {
    kcal: food.kcal*factor, protein: food.p*factor, fat: food.f*factor,
    carb: food.c*factor, fiber: food.fiber*factor, salt: food.salt*factor,
    veg: food.veg ? qty : 0
  };
}
function sumNutrients(list){
  var t = {kcal:0,protein:0,fat:0,carb:0,fiber:0,salt:0,veg:0};
  list.forEach(function(m){
    Object.keys(t).forEach(function(k){ t[k]+= (m.nutrients[k]||0); });
  });
  return t;
}
function todaysMeals(){
  var t = todayStr();
  return state.meals.filter(function(m){ return m.date===t; });
}
function todaysSteps(){
  return (state.steps && state.steps[todayStr()]) || 0;
}
/* rough estimate: ~30-40kcal per 1000 steps for an average adult, scaled by body weight when known */
function extraKcalFromSteps(steps){
  if(!steps) return 0;
  var perStep = state.profile ? state.profile.weight*0.0005 : 0.035;
  return Math.round(steps*perStep);
}

/* upper-limit nutrients should not be exceeded; the rest are minimum targets */
var UPPER_LIMIT = {fat:true, salt:true};
function nutrientStatus(key, consumed, target){
  if(!target) return "good";
  var ratio = consumed/target;
  if(UPPER_LIMIT[key]){
    if(ratio>1.0) return "crit";
    if(ratio>0.85) return "warn";
    return "good";
  }
  if(key==="kcal"){
    if(ratio<0.7 || ratio>1.2) return "warn";
    return "good";
  }
  if(ratio<0.8) return "warn";
  return "good";
}
var STATUS_LABEL = {
  fat:{good:"適正",warn:"注意",crit:"過剰"},
  salt:{good:"適正",warn:"注意",crit:"過剰"},
  kcal:{good:"適正",warn:"ズレあり",crit:"適正"},
  protein:{good:"適正",warn:"不足",crit:"不足"},
  carb:{good:"適正",warn:"不足",crit:"不足"},
  fiber:{good:"適正",warn:"不足",crit:"不足"},
  veg:{good:"適正",warn:"不足",crit:"不足"}
};

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.classList.toggle("active", b===btn); });
  document.querySelectorAll("section.panel").forEach(function(p){ p.classList.toggle("active", p.dataset.panel===btn.dataset.tab); });
});

/* ---------- render: HOME ---------- */
function foodRole(f){
  if(!f) return null;
  if(f.cat==="meat" || f.cat==="fish" || f.cat==="egg_dairy" || f.cat==="soy") return "protein";
  if(f.cat==="veg" && f.veg) return "veg";
  if(f.cat==="grain") return "carb";
  return null;
}

function suggestionList(){
  var totals = sumNutrients(todaysMeals());
  var targets = state.targets;
  var pantry = state.pantry.slice().sort(function(a,b){ return daysUntil(a.expiry)-daysUntil(b.expiry); });
  var soon = pantry.filter(function(p){ return daysUntil(p.expiry)<=4; });
  if(soon.length===0) soon = pantry.slice(0,4);

  var cards = [];

  /* caution: nutrients already over their upper limit today */
  if(targets){
    var overNow = ["fat","salt"].filter(function(k){ return nutrientStatus(k, totals[k], targets[k])==="crit"; });
    if(overNow.length){
      cards.push({
        ic: "⚠️",
        t: overNow.map(function(k){ return NUTRIENT_LABEL[k]; }).join("・") + "がすでに目標を超過",
        d: "味付けや揚げ物は控えめに、次の食事は薄味・低脂質を意識しましょう"
      });
    }
  }

  var deficient = targets ? ["protein","fiber","veg"].filter(function(k){
      return nutrientStatus(k, totals[k], targets[k])!=="good";
    }).sort(function(a,b){ return (totals[a]/targets[a]) - (totals[b]/targets[b]); }) : [];

  var tagged = soon.map(function(p){
    var f = FOOD_BY_KEY[p.foodKey];
    var helps = [];
    if(f){
      if(f.p>=14) helps.push("protein");
      if(f.fiber>=2.5) helps.push("fiber");
      if(f.veg) helps.push("veg");
    }
    return { p:p, f:f, role:foodRole(f), helps:helps, days:daysUntil(p.expiry) };
  });

  var usedIds = {};
  function pickBest(pool, helpKey){
    var candidates = pool.filter(function(t){ return !usedIds[t.p.id]; });
    var withHelp = helpKey ? candidates.filter(function(t){ return t.helps.indexOf(helpKey)>=0; }) : candidates;
    var arr = withHelp.length ? withHelp : candidates;
    if(!arr.length) return null;
    arr.sort(function(a,b){ return a.days-b.days; });
    return arr[0];
  }
  var proteinPool = tagged.filter(function(t){ return t.role==="protein"; });
  var vegPool = tagged.filter(function(t){ return t.role==="veg"; });
  var carbPool = tagged.filter(function(t){ return t.role==="carb"; });

  /* combine up to 2 complementary "meal" suggestions from soon-to-expire items */
  for(var i=0;i<2;i++){
    var wantNutrient = deficient[i] || deficient[0] || null;
    var proteinNeed = wantNutrient==="protein" || !wantNutrient;
    var vegNeed = wantNutrient==="fiber" || wantNutrient==="veg" || !wantNutrient;

    var chosen = [];
    var prot = pickBest(proteinPool, proteinNeed ? "protein" : null);
    if(prot){ chosen.push(prot); usedIds[prot.p.id]=true; }
    var veg = pickBest(vegPool, vegNeed ? (wantNutrient==="fiber"?"fiber":"veg") : null);
    if(veg){ chosen.push(veg); usedIds[veg.p.id]=true; }
    if(chosen.length<2){
      var carb = pickBest(carbPool, null);
      if(carb){ chosen.push(carb); usedIds[carb.p.id]=true; }
    }
    if(!chosen.length) break;

    var coveredNutrients = [];
    chosen.forEach(function(c){ c.helps.forEach(function(h){ if(deficient.indexOf(h)>=0 && coveredNutrients.indexOf(h)<0) coveredNutrients.push(h); }); });

    var dishTitle = buildDishTitle(chosen);
    var minDays = Math.min.apply(null, chosen.map(function(c){ return c.days; }));
    var expiryText = minDays<=0 ? "本日中に期限" : "あと"+minDays+"日で期限";
    var reasonText = coveredNutrients.length ? coveredNutrients.map(function(k){ return NUTRIENT_LABEL[k]; }).join("・")+"を補給" : "食材を使い切る";
    var icon = chosen[0].f ? (CAT_ICON[chosen[0].f.cat]||"🍽️") : "🍽️";
    var items = chosen.filter(function(c){ return c.p.foodKey; }).map(function(c){
      return { foodKey: c.p.foodKey, qty: defaultServingGrams(c.f.cat), pantryId: c.p.id, unit: c.p.unit };
    });

    cards.push({ ic: icon, t: dishTitle, d: reasonText+" ・ "+expiryText, items: items });
  }

  /* fallback: remaining soon items not used in a combo above */
  var leftover = tagged.filter(function(t){ return !usedIds[t.p.id]; }).sort(function(a,b){ return a.days-b.days; });
  if(leftover.length && cards.length<4){
    leftover.slice(0, 4-cards.length).forEach(function(t){
      var d = t.days;
      cards.push({
        ic: t.f ? (CAT_ICON[t.f.cat]||"🍽️") : "⏳",
        t: t.p.name+"を早めに使いましょう",
        d: (d<=0 ? "賞味期限：今日まで" : "あと"+d+"日で期限") + " ・ 在庫 "+t.p.qty+t.p.unit,
        items: t.f ? [{ foodKey: t.p.foodKey, qty: defaultServingGrams(t.f.cat), pantryId: t.p.id, unit: t.p.unit }] : []
      });
    });
  }
  return cards.slice(0,4);
}
function defaultServingGrams(cat){
  if(cat==="grain") return 150;
  if(cat==="veg") return 80;
  return 100;
}
var DISH_STYLES = {
  meat: ["オイスター炒め","生姜炒め","にんにく醤油炒め","味噌炒め","甘辛炒め"],
  fish: ["塩焼き","味噌煮","バター醤油炒め","照り焼き"],
  soy: ["甘辛煮","味噌炒め","ごま和え","だし煮"],
  egg_dairy: ["卵とじ","ソテー","グラタン風"]
};
function pickDishStyle(seed, cat){
  var options = DISH_STYLES[cat] || ["炒め物"];
  var hash = 0;
  for(var i=0;i<seed.length;i++) hash += seed.charCodeAt(i);
  return options[hash % options.length];
}
function buildDishTitle(chosen){
  var protein = chosen.find(function(c){ return c.role==="protein"; });
  var veg = chosen.find(function(c){ return c.role==="veg"; });
  if(protein && veg && protein.f){
    return protein.p.name+"と"+veg.p.name+"の"+pickDishStyle(protein.f.key, protein.f.cat);
  }
  if(protein && protein.f){
    return protein.p.name+"の"+pickDishStyle(protein.f.key, protein.f.cat);
  }
  if(veg){
    return veg.p.name+"のスープ・和え物";
  }
  return chosen.map(function(c){ return c.p.name; }).join("＋")+"の調理";
}

/* like renderHome()'s daily meters, but scoped to one meal (this meal's amount as a share of
   the full daily target) — no good/warn/crit judgement, since a single meal being far below
   the daily target is normal and not something to flag */
function mealTypeMeters(totals){
  var targets = state.targets;
  var meterKeys = ["kcal","protein","fat","carb","fiber","salt","veg"];
  return meterKeys.map(function(k){
    var consumed = totals[k];
    var target = targets ? targets[k] : 0;
    var pct = target ? Math.min(100, Math.round(consumed/target*100)) : 0;
    return '<div class="meter">'
      + '<div class="mh"><span class="name">'+NUTRIENT_LABEL[k]+'</span>'
      + '<span class="nums">'+round1(consumed)+' / '+(target||"–")+' '+NUTRIENT_UNIT[k]+'</span></div>'
      + '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'
      + (target ? '<span class="badge neutral">1日の目標の'+pct+'%</span>' : '')
      + '</div>';
  }).join("");
}

/* a simple 0-100 "how healthy does this pantry look right now" score — client-side only,
   no AI needed. 60pt for freshness (expired/expiring-soon items drag it down), 40pt for
   whether a protein source, a vegetable, and a grain are all currently in stock. */
function pantryHealthScore(){
  var pantry = state.pantry;
  if(!pantry.length) return null;
  var expired = pantry.filter(function(p){ return daysUntil(p.expiry) < 0; }).length;
  var expiringSoon = pantry.filter(function(p){ var d=daysUntil(p.expiry); return d>=0 && d<=2; }).length;
  var freshPenalty = expired*2 + expiringSoon;
  var freshRatio = Math.max(0, 1 - freshPenalty/pantry.length);
  var hasProtein = pantry.some(function(p){ return p.category==="meat"||p.category==="fish"||p.category==="egg_dairy"||p.category==="soy"; });
  var hasVeg = pantry.some(function(p){ return p.category==="veg"; });
  var hasGrain = pantry.some(function(p){ return p.category==="grain"; });
  var varietyCount = [hasProtein, hasVeg, hasGrain].filter(Boolean).length;
  var score = Math.round(freshRatio*60) + Math.round(varietyCount/3*40);
  return { score: score, expired: expired, expiringSoon: expiringSoon, hasProtein: hasProtein, hasVeg: hasVeg, hasGrain: hasGrain };
}

function renderHome(){
  var el = document.getElementById("panel-home");
  var targets = state.targets;
  var totals = sumNutrients(todaysMeals());
  var steps = todaysSteps();
  var stepsExtra = extraKcalFromSteps(steps);

  var meterKeys = ["kcal","protein","fat","carb","fiber","salt","veg"];
  var metersHtml = meterKeys.map(function(k){
    var consumed = totals[k];
    var target = targets ? targets[k] : 0;
    if(k==="kcal" && target) target += stepsExtra;
    var pct = target ? Math.min(100, Math.round(consumed/target*100)) : 0;
    var st = targets ? nutrientStatus(k, consumed, target) : "good";
    var label = targets ? STATUS_LABEL[k][st] : "目標未設定";
    var note = "";
    if(k==="kcal" && stepsExtra) note = '<div class="note">歩数 '+steps.toLocaleString()+' 歩分 +'+stepsExtra+' kcal を加算</div>';
    return '<div class="meter">'
      + '<div class="mh"><span class="name">'+NUTRIENT_LABEL[k]+'</span>'
      + '<span class="nums">'+round1(consumed)+' / '+(target||"–")+' '+NUTRIENT_UNIT[k]+'</span></div>'
      + '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'
      + '<span class="badge '+(targets?st:"warn")+'">'+label+'</span>'
      + note
      + '</div>';
  }).join("");

  var pantrySorted = state.pantry.slice().sort(function(a,b){ return daysUntil(a.expiry)-daysUntil(b.expiry); }).slice(0,5);
  var expiringHtml = pantrySorted.length ? '<div class="list">' + pantrySorted.map(function(p){ return rowItemHtml(p, false); }).join("") + '</div>'
    : '<div class="empty"><div class="glyph">🧺</div><p>パントリーに食材を登録すると、賞味期限が近いものがここに並びます。</p></div>';

  var suggestions = suggestionList();
  var suggestHtml = suggestions.length ? '<div class="suggest-list">' + suggestions.map(function(s, idx){
      var logBtn = (s.items && s.items.length) ? '<button type="button" class="btn small suggest-log-btn" data-idx="'+idx+'" style="margin-top:8px">これを記録する</button>' : '';
      return '<div class="suggest-card"><div class="ic">'+s.ic+'</div><div><div class="t">'+s.t+'</div><div class="d">'+s.d+'</div>'+logBtn+'</div></div>';
    }).join("") + '</div>'
    : '<div class="empty"><div class="glyph">🍽️</div><p>食材と食事記録がそろうと、おすすめの献立をここに表示します。</p></div>';

  var suggestCard;
  if(hasGeminiKey()){
    var aiBody;
    if(aiSuggestUi.status==="loading"){
      aiBody = '<div class="hint" style="margin-top:10px">AIが考え中…（5〜30秒ほどかかります）</div>';
    } else if(aiSuggestUi.status==="error"){
      aiBody = '<div class="hint" style="margin-top:10px;color:var(--crit)">'+aiSuggestUi.error+'</div>';
    } else if(aiSuggestUi.status==="done" && aiSuggestUi.dishes.length){
      var health = aiSuggestUi.pollinationsHealth;
      var healthNote = "";
      if(imageGenEnabled && health){
        /* A raw "success rate %" reads like a probability you might lose, which isn't a
           useful mental model for a one-off manual click. A traffic-light label is a more
           direct answer to "is it worth trying right now" — the number is still shown for
           anyone who wants the detail, just not leading. Thresholds are a judgment call, not
           derived from anything Pollinations documents. We can't show the *time window* this
           rate covers (Pollinations doesn't document it, and the raw total_requests count
           observed live actually goes down between polls sometimes — consistent with some
           kind of rolling window, but not enough evidence to state a specific duration
           without guessing) — the ratio itself stays meaningful regardless. */
        var pct = Math.round(health.successRate*100);
        var tone = health.successRate>=0.8 ? "good" : health.successRate>=0.5 ? "warn" : "crit";
        var label = health.successRate>=0.8 ? "🟢 空いています" : health.successRate>=0.5 ? "🟡 やや混雑しています" : "🔴 かなり混雑しています";
        healthNote = '<div class="hint" style="margin-top:10px;color:var(--'+tone+'-ink);background:var(--'+tone+'-soft);padding:8px 12px;border-radius:10px">'
          + '画像生成サービス(Pollinations.ai): '+label+'（参考: 直近の成功率 約'+pct+'%）'
          + '</div>';
      }
      aiBody = healthNote + '<div class="suggest-list" style="margin-top:10px">' + aiSuggestUi.dishes.map(function(d, idx){
        var ingredientsHtml = (d.ingredients||[]).map(function(ing){
          var has = !!ing.matchedPantryId;
          var statusHtml = has
            ? '<span style="font-size:11px;color:var(--good-ink);background:var(--good-soft);padding:1px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0">在庫あり</span>'
            : '<span style="font-size:11px;color:var(--crit-ink);background:var(--crit-soft);padding:1px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0">不足</span>';
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
            + '<span>・'+escapeAttr(ing.name)+' '+Math.round(ing.estimatedGrams||0)+'g</span>'
            + statusHtml
            + '</div>';
        }).join("");
        var imageBlock = d.imageDataUrl
          ? '<img src="'+d.imageDataUrl+'" style="width:100%;border-radius:10px;margin-bottom:8px;display:block">'
          : (d.imageLoading ? '<div class="hint" style="margin-bottom:6px">🎨 画像を生成中…（'+(d.imageAttemptNum||1)+'/'+POLLINATIONS_MAX_ATTEMPTS+'回目）</div>'
            : (d.imageAttempted ? '<div class="hint" style="margin-bottom:6px;color:var(--crit)">画像を生成できませんでした（'+POLLINATIONS_MAX_ATTEMPTS+'回試行）</div>' : ''));
        /* Only shown once the whole auto-generation batch has fully settled (added
           2026-09-19, user-diagnosed bug): a dish's image popping in mid-batch grows that
           card's height and shifts every card below it, so a tap aimed at a button on a
           still-loading dish can land on a different dish's button once the layout has
           already shifted underneath it — exactly what happened when a tap meant for dish 2
           ended up starting dish 3 instead. Hiding every image button while the batch is
           running removes anything tappable from that shifting layout in the first place. */
        var imageBtn = (imageGenEnabled && !d.imageLoading && !aiSuggestUi.imageGenBatchInProgress)
          ? '<button type="button" class="btn ghost small ai-suggest-img-btn" data-idx="'+idx+'">'+(d.imageDataUrl?"🔄 別の画像に":(d.imageAttempted?"🎨 再試行":"🎨 画像を生成"))+'</button>'
          : '';
