function expiryBadge(days){
  if(days<0) return {color:"var(--crit)", text: Math.abs(days)+"日超過"};
  if(days<=1) return {color:"var(--crit)", text: days===0 ? "本日まで" : "あと1日"};
  if(days<=3) return {color:"var(--warn)", text:"あと"+days+"日"};
  return {color:"var(--good)", text:"あと"+days+"日"};
}
function rowItemHtml(p, showActions){
  var d = daysUntil(p.expiry);
  var b = expiryBadge(d);
  var f = FOOD_BY_KEY[p.foodKey];
  var icon = p.icon || CAT_ICON[p.category] || "🍽️";
  var actions = showActions
    ? '<button class="btn ghost small minus-btn" data-id="'+p.id+'" title="1つ使った">－1</button>'
      + '<button class="btn ghost small consume-btn" data-id="'+p.id+'" title="残り全部を使い切った/廃棄した">🗑</button>'
    : "";
  return '<div class="row-item" data-id="'+p.id+'">'
    + '<div class="dot" style="background:'+b.color+'"></div>'
    + '<div class="main"><div class="name">'+icon+' '+p.name+'</div><div class="meta">'+p.qty+p.unit+' ・ '+CAT_LABEL[p.category]+'</div></div>'
    + '<span class="days" style="color:'+b.color+'">'+b.text+'</span>'
    + '<span class="tag">'+p.expiry+'</span>'
    + actions
    + '</div>';
}

function addToShoppingList(name){
  if(!name) return;
  state.shoppingList = state.shoppingList.filter(function(s){ return s.name !== name; });
  state.shoppingList.unshift({ id: uid(), name: name, addedAt: Date.now() });
  if(state.shoppingList.length > 30) state.shoppingList.length = 30;
}
function pushRecentFood(entry){
  state.recentFoods = state.recentFoods.filter(function(r){ return r.name !== entry.name; });
  state.recentFoods.unshift(entry);
  if(state.recentFoods.length > 8) state.recentFoods.length = 8;
}
/* nudge the shopping list once a count-based item is down to its last unit, not only after
   it's fully gone — g/ml units have no reliable "running low" threshold, so skip those */
function addToShoppingListIfLow(item){
  if(!item || item.unit==="g" || item.unit==="ml") return;
  if(item.qty <= 1) addToShoppingList(item.name);
}
/* g/ml stock is reduced by the estimated amount actually used; count-based units
   (個・パック・本・枚・その他) have no reliable gram equivalent, so treat one use as -1 */
function deductPantryForConsumption(stock, estimatedGrams){
  var amount = (stock.unit==="g" || stock.unit==="ml") ? estimatedGrams : 1;
  stock.qty = Math.max(0, round1(stock.qty - amount));
  addToShoppingListIfLow(stock);
  if(stock.qty === 0){ state.pantry = state.pantry.filter(function(p){ return p !== stock; }); }
}

  if(!matches.length){ noteEl.innerHTML = ""; return; }
  if(matches.length === 1){
    var existing = matches[0];
    var d = daysUntil(existing.expiry);
    var expiryText = d<=0 ? "本日まで" : "あと"+d+"日";
    var qtyStep = (existing.unit==="g" || existing.unit==="ml") ? "0.1" : "1";
    noteEl.innerHTML =
      '<div class="barcode-note">この食材はすでに在庫があります：現在 '+existing.qty+existing.unit+'（賞味期限 '+existing.expiry+' ・ '+expiryText+'）'

      +   '<span style="font-size:12.5px;color:var(--ink-2)">'+existing.unit+' 追加</span>'
      +   '<button type="button" id="pf_incBtn" class="btn small">反映する</button>'

    document.getElementById("pf_incBtn").addEventListener("click", function(){

  document.getElementById("pf_food").addEventListener("change", function(){

    if(this.value && this.value!=="__custom"){
      checkExistingStock(state.pantry.filter(function(p){ return p.foodKey===f.key; }));
    } else {
      checkExistingStock([]);

  if(state.pantry.length){
    document.getElementById("pantryCatFilter").addEventListener("click", function(e){

    });
    document.getElementById("pantryExpiryFilter").addEventListener("click", function(e){
      var b = e.target.closest("button[data-days]"); if(!b) return;

      renderPantry();

      pantryUi.search = this.value; renderPantry();

  var recentEl = document.getElementById("recentFoodChips");

    recentEl.addEventListener("click", function(e){
      var b = e.target.closest("button[data-idx]"); if(!b) return;

      if(!r) return;
      pendingBarcode = null;
      if(r.foodKey && FOOD_BY_KEY[r.foodKey]){
        document.getElementById("pf_food").value = r.foodKey;
        document.getElementById("pf_customWrap").style.display = "none";
        checkExistingStock(state.pantry.filter(function(p){ return p.foodKey===r.foodKey; }));
      } else {
        document.getElementById("pf_food").value = "__custom";
        document.getElementById("pf_customWrap").style.display = "";
        document.getElementById("pf_custom").value = r.name;
        document.getElementById("pf_customCat").value = r.category || "other";
        checkExistingStock(state.pantry.filter(function(p){ return !p.foodKey && p.name===r.name; }));
      }
      document.getElementById("pf_unit").value = r.unit;
    });
  }

  document.getElementById("shoppingForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = document.getElementById("shoppingInput");
    var name = (input.value||"").trim();
    if(!name) return;
    addToShoppingList(name);
    input.value = "";
    persist(["shoppingList"]); renderAll();
  });
  var shoppingShareBtn = document.getElementById("shoppingShareBtn");
  if(shoppingShareBtn){
    shoppingShareBtn.addEventListener("click", function(){
      var text = "買い物リスト（NutriStock）\n" + state.shoppingList.map(function(s){ return "・"+s.name; }).join("\n");
      navigator.share({ title: "買い物リスト", text: text }).catch(function(){});
    });
  }
  if(!el.dataset.shoppingBound){
    el.dataset.shoppingBound = "1";
    el.addEventListener("click", function(e){
      var delBtn = e.target.closest(".shopping-del");
      if(!delBtn) return;
      state.shoppingList = state.shoppingList.filter(function(s){ return s.id!==delBtn.dataset.id; });
      persist(["shoppingList"]); renderAll();
    });
  }
  var dEl = document.getElementById("pf_expiry");
  var t = new Date(); t.setDate(t.getDate()+7);
  dEl.value = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");

  document.getElementById("pf_scanBtn").addEventListener("click", function(){
    openScanner(async function(code){
      var known = state.barcodes[code];
      var existing = state.pantry.find(function(p){ return p.barcode === code; });
      console.log("[NutriStock] パントリーで受信:", code, known ? "（登録済み: "+known.name+"）" : "（新規）", existing ? "在庫あり" : "在庫なし");
      var noteEl = document.getElementById("pf_barcodeNote");
      var prefillName = known ? known.name : (existing ? existing.name : "");
      var prefillUnit = known ? known.unit : (existing ? existing.unit : null);
      var prefillCat = known ? known.category : (existing ? existing.category : null);
      document.getElementById("pf_food").value = "__custom";
      document.getElementById("pf_customWrap").style.display = "";
      document.getElementById("pf_custom").value = prefillName;
      if(prefillUnit) document.getElementById("pf_unit").value = prefillUnit;
      if(prefillCat) document.getElementById("pf_customCat").value = prefillCat;
      pendingBarcode = code;
      pendingBarcodeNutrition = known ? (known.nutrition100 || null) : null;

      if(existing){
        checkExistingStock([existing]);
        if(!prefillName) document.getElementById("pf_custom").focus();
        return;
      }
      if(known){
        noteEl.innerHTML = '<div class="barcode-note">前回の登録内容を自動入力しました（JAN: '+escapeAttr(code)+'）</div>';
        return;
      }
      /* first time seeing this barcode — try Open Food Facts before asking the viewer to type it in */
      noteEl.innerHTML = '<div class="barcode-note">Open Food Factsで商品を検索中…（JAN: '+escapeAttr(code)+'）</div>';
      var off = await lookupOpenFoodFacts(code);
      if(off){
        document.getElementById("pf_custom").value = off.name;
        pendingBarcodeNutrition = off.nutrition100;
        noteEl.innerHTML = '<div class="barcode-note">Open Food Factsから自動入力しました（栄養情報も取得済み・JAN: '+escapeAttr(code)+'）</div>';
      } else {
        document.getElementById("pf_custom").focus();
        noteEl.innerHTML = '<div class="barcode-note">初めてのバーコードです（JAN: '+escapeAttr(code)+'）。食材名を入力すると次回から自動入力されます</div>';
      }
    });
  });

  document.getElementById("pantryForm").addEventListener("submit", function(e){
    e.preventDefault();
    var now = Date.now();
    if(now - lastPantrySubmitAt < 800) return; /* guard against an accidental rapid double-tap adding the item twice */
    var foodKey = document.getElementById("pf_food").value;
    if(!foodKey){ return; }
    var custom = foodKey==="__custom";
    var name = custom ? (document.getElementById("pf_custom").value||"").trim() : FOOD_BY_KEY[foodKey].name;
    if(!name) return;
    var qty = parseFloat(document.getElementById("pf_qty").value)||0;
    var unit = document.getElementById("pf_unit").value;
    var expiry = document.getElementById("pf_expiry").value;
    if(!expiry) return;
    var cat = custom ? document.getElementById("pf_customCat").value : FOOD_BY_KEY[foodKey].cat;
    lastPantrySubmitAt = now;
    var barcodeChanged = false;
    if(pendingBarcode){
      state.barcodes[pendingBarcode] = { name: name, unit: unit, category: cat, nutrition100: pendingBarcodeNutrition || null };
      barcodeChanged = true;
    }
    var mergeTarget = state.pantry.find(function(p){
      var sameFood = custom ? (!p.foodKey && p.name===name) : (p.foodKey===foodKey);
      return sameFood && p.expiry===expiry;
    });
    var pushedItem = null;
    if(mergeTarget){
      mergeTarget.qty = round1(mergeTarget.qty + qty);
      if(pendingBarcode && !mergeTarget.barcode) mergeTarget.barcode = pendingBarcode;
      if(pendingBarcodeNutrition && !mergeTarget.nutrition100) mergeTarget.nutrition100 = pendingBarcodeNutrition;
    } else {
      pushedItem = { id: uid(), name: name, foodKey: custom?null:foodKey, category: cat, qty: qty, unit: unit, expiry: expiry, barcode: pendingBarcode||null, nutrition100: pendingBarcodeNutrition||null, addedAt: Date.now() };
      state.pantry.push(pushedItem);
    }
    pushRecentFood({ name: name, foodKey: custom?null:foodKey, unit: unit, category: cat });
    state.shoppingList = state.shoppingList.filter(function(s){ return s.name !== name; }); /* bought it, drop from the list if present */
    pendingBarcode = null;
    pendingBarcodeNutrition = null;
    var noteEl = document.getElementById("pf_barcodeNote");
    if(noteEl) noteEl.innerHTML = "";
    persist(barcodeChanged ? ["pantry","barcodes","recentFoods","shoppingList"] : ["pantry","recentFoods","shoppingList"]); renderAll();

    /* custom/barcode items have no FOOD_DB icon — ask Gemini for a fitting emoji in the
       background (only once per item) rather than blocking the add on it */
    var iconTarget = mergeTarget || pushedItem;
    if(custom && iconTarget && !iconTarget.icon){
      guessFoodIcon(name).then(function(emoji){
        if(!emoji) return;
        var stillThere = state.pantry.find(function(p){ return p.id===iconTarget.id; });
        if(!stillThere) return;
        stillThere.icon = emoji;
        persist(["pantry"]); renderAll();
      });
    }
  });

  if(!el.dataset.stockBound){
    el.dataset.stockBound = "1";
    el.addEventListener("click", function(e){
      var minusBtn = e.target.closest(".minus-btn");
      if(minusBtn){
        var item = state.pantry.find(function(p){ return p.id===minusBtn.dataset.id; });
        if(item){
          item.qty = round1(item.qty - 1);
          addToShoppingListIfLow(item);
          if(item.qty <= 0){
            state.pantry = state.pantry.filter(function(p){ return p.id!==item.id; });
          }
        }
        persist(["pantry","shoppingList"]); renderAll();
        return;
      }
      var btn = e.target.closest(".consume-btn");
      if(!btn) return;
      var consumed = state.pantry.find(function(p){ return p.id===btn.dataset.id; });
      state.pantry = state.pantry.filter(function(p){ return p.id!==btn.dataset.id; });
      if(consumed) addToShoppingList(consumed.name);
      persist(["pantry","shoppingList"]); renderAll();
    });
  }

  var receiptGoSettingsBtn = document.getElementById("receiptGoSettingsBtn");

  }
  var receiptInputEl = document.getElementById("receiptInput");
  if(receiptInputEl){
    receiptInputEl.addEventListener("change", function(){
      var file = this.files && this.files[0];
      if(!file) return;
      if(receiptUi.previewUrl) URL.revokeObjectURL(receiptUi.previewUrl);
      receiptUi.file = file;
      receiptUi.previewUrl = URL.createObjectURL(file);
      runReceiptAnalysis(file);
    });
  }
  var receiptCancelBtn = document.getElementById("receiptCancelBtn");
  if(receiptCancelBtn){
    receiptCancelBtn.addEventListener("click", function(){
      if(receiptUi.previewUrl) URL.revokeObjectURL(receiptUi.previewUrl);
      receiptUi = { file:null, previewUrl:null, status:"idle", items:[], error:"" };
      renderPantry();
    });
  }
  var receiptAddBtn = document.getElementById("receiptAddBtn");
  if(receiptAddBtn){
    receiptAddBtn.addEventListener("click", function(){
      var rows = el.querySelectorAll(".receipt-row");
      rows.forEach(function(row){
        var use = row.querySelector(".ri-use").checked;
        if(!use) return;
        var name = (row.querySelector(".ri-name").value||"").trim();
        if(!name) return;
        var cat = row.querySelector(".ri-cat").value;
        var qty = parseFloat(row.querySelector(".ri-qty").value)||0;
        var unit = row.querySelector(".ri-unit").value;
        var expiry = row.querySelector(".ri-expiry").value;
        if(!expiry) return;
        var mergeTarget = state.pantry.find(function(p){ return !p.foodKey && p.name===name && p.expiry===expiry; });
        var pushedItem = null;
        if(mergeTarget){
          mergeTarget.qty = round1(mergeTarget.qty + qty);
        } else {
          pushedItem = { id: uid(), name: name, foodKey: null, category: cat, qty: qty, unit: unit, expiry: expiry, barcode: null, addedAt: Date.now() };
          state.pantry.push(pushedItem);
        }
        pushRecentFood({ name: name, foodKey: null, unit: unit, category: cat });
        state.shoppingList = state.shoppingList.filter(function(s){ return s.name !== name; });
        var iconTarget = mergeTarget || pushedItem;
        if(iconTarget && !iconTarget.icon){
          guessFoodIcon(name).then(function(emoji){
            if(!emoji) return;
            var stillThere = state.pantry.find(function(p){ return p.id===iconTarget.id; });
            if(!stillThere) return;
            stillThere.icon = emoji;
            persist(["pantry"]); renderAll();
          });
        }
      });
      if(receiptUi.previewUrl) URL.revokeObjectURL(receiptUi.previewUrl);
      receiptUi = { file:null, previewUrl:null, status:"idle", items:[], error:"" };
      persist(["pantry","recentFoods","shoppingList"]); renderAll();
    });
  }
}

  el.querySelector("#mealForm").addEventListener("submit", function(e){
    e.preventDefault();
    var foodKey = document.getElementById("mf_food").value;
    if(!foodKey) return;
    var qty = parseFloat(document.getElementById("mf_qty").value)||0;
    var name, nutrients;
    var pantryChanged = false;
    if(foodKey==="__custom"){
      name = (document.getElementById("mf_cname").value||"").trim();
      if(!name) return;
      nutrients = {
        kcal: parseFloat(document.getElementById("mf_ckcal").value)||0,
        protein: parseFloat(document.getElementById("mf_cp").value)||0,
        fat: parseFloat(document.getElementById("mf_cf").value)||0,
        carb: parseFloat(document.getElementById("mf_cc").value)||0,
        fiber: 0, salt: 0, veg: 0
      };
    } else if(foodKey.indexOf("pantry:")===0){
      var pItem = state.pantry.find(function(p){ return p.id===foodKey.slice(7); });
      if(!pItem || !pItem.nutrition100) return;
      name = pItem.name;
      var n100 = pItem.nutrition100;
      var factor = qty/100;
      nutrients = { kcal: n100.kcal*factor, protein: n100.p*factor, fat: n100.f*factor, carb: n100.c*factor, fiber: n100.fiber*factor, salt: n100.salt*factor, veg: 0 };
      var deductElP = document.getElementById("mf_deduct");
      if(deductElP && deductElP.checked){
        deductPantryForConsumption(pItem, qty);
        pantryChanged = true;
      }
    } else {
      var f = FOOD_BY_KEY[foodKey];
      name = f.name;
      nutrients = nutrientsForFood(f, qty);
      var deductEl = document.getElementById("mf_deduct");
      if(deductEl && deductEl.checked){
        var stock = state.pantry.find(function(p){ return p.foodKey===foodKey; });
        if(stock){ deductPantryForConsumption(stock, qty); pantryChanged = true; }
      }
    }
    state.meals.push({ id: uid(), date: mealsUi.date, type: mealsUi.type, name: name, qty: qty, nutrients: nutrients, createdAt: Date.now() });
    persist(pantryChanged ? ["meals","pantry","shoppingList"] : ["meals"]); renderAll();
  });
  if(!el.dataset.mealDelBound){
    el.dataset.mealDelBound = "1";
    el.addEventListener("click", function(e){
      var b = e.target.closest(".meal-del"); if(!b) return;
      state.meals = state.meals.filter(function(m){ return m.id!==b.dataset.id; });
      persist(["meals"]); renderAll();
    });
  }
  if(!el.dataset.ingredientUiBound){
    el.dataset.ingredientUiBound = "1";
    /* dish-level cook-toggle / ingredient add-remove: plain DOM manipulation (no renderMeals())
       so in-progress edits in other rows/inputs aren't wiped by a full re-render */
    el.addEventListener("click", function(e){
      var cookBtn = e.target.closest(".cook-btn");
      if(cookBtn){
        var group = cookBtn.closest(".cook-toggle");
        group.querySelectorAll(".cook-btn").forEach(function(b){ b.classList.toggle("active", b===cookBtn); });
        var panel = group.nextElementSibling;
        if(panel && panel.classList.contains("ingredient-panel")) panel.hidden = (cookBtn.dataset.mode === "out");
        return;
      }
      var removeBtn = e.target.closest(".ing-remove");
      if(removeBtn){
        removeBtn.closest(".ingredient-row").remove();
        return;
      }
      var addBtn = e.target.closest(".ing-add-btn");
      if(addBtn){
        var list = addBtn.closest(".ingredient-panel").querySelector(".ingredient-list");
        list.insertAdjacentHTML("beforeend", ingredientRowHtml({ name:"", estimatedGrams:0, matchedPantryId:null }));
        return;
      }
    });
  }

  var photoGoSettingsBtn = document.getElementById("photoGoSettingsBtn");
  if(photoGoSettingsBtn){
    photoGoSettingsBtn.addEventListener("click", function(){
      var settingsTabBtn = document.querySelector('nav.tabs button[data-tab="settings"]');
      if(settingsTabBtn) settingsTabBtn.click();
    });
  }
  var photoInputEl = document.getElementById("photoInput");
  if(photoInputEl){
    photoInputEl.addEventListener("change", function(){
      var file = this.files && this.files[0];
      if(!file) return;
      if(photoUi.previewUrl) URL.revokeObjectURL(photoUi.previewUrl);
      photoUi.file = file;
      photoUi.previewUrl = URL.createObjectURL(file);
      runPhotoAnalysis(file);
    });
  }
  var voiceRecordBtn = document.getElementById("voiceRecordBtn");
  if(voiceRecordBtn) voiceRecordBtn.addEventListener("click", startVoiceRecording);
  var photoAddBtn = document.getElementById("photoAddBtn");
  if(photoAddBtn){
    photoAddBtn.addEventListener("click", function(){
      var rows = el.querySelectorAll(".photo-row");
      var pantryChanged = false;
      rows.forEach(function(row){
        var idx = parseInt(row.dataset.idx,10);
        var checked = row.querySelector(".pi-check").checked;
        if(!checked) return;
        var item = photoUi.items[idx];
        var qty = parseFloat(row.querySelector(".pi-qty").value)||0;
        var nutrients = nutrientsForPhotoItem(item, qty);

        var cookBtn = row.querySelector(".cook-btn.active");
        var isHomeCooked = cookBtn ? cookBtn.dataset.mode !== "out" : false;
        var usedIngredients = [];
        if(isHomeCooked){
          row.querySelectorAll(".ingredient-row").forEach(function(ingRow){
            var use = ingRow.querySelector(".ing-use").checked;
            if(!use) return;
            var ingName = (ingRow.querySelector(".ing-name").value||"").trim();
            var ingQty = parseFloat(ingRow.querySelector(".ing-qty").value)||0;
            if(ingName) usedIngredients.push({ name: ingName, estimatedGrams: ingQty });
            var linkSel = ingRow.querySelector(".ing-link");
            var pantryId = linkSel ? linkSel.value : "";
            if(!pantryId) return;
            var stock = state.pantry.find(function(p){ return p.id===pantryId; });
            if(stock){ deductPantryForConsumption(stock, ingQty); pantryChanged = true; }
          });
        }
        state.meals.push({
          id: uid(), date: mealsUi.date, type: mealsUi.type, name: item.name, qty: qty, nutrients: nutrients, createdAt: Date.now(),
          cookMode: isHomeCooked ? "home" : "out", ingredients: usedIngredients
        });
      });
      if(photoUi.previewUrl) URL.revokeObjectURL(photoUi.previewUrl);
      photoUi = { file:null, previewUrl:null, status:"idle", items:[], error:"" };
      persist(pantryChanged ? ["meals","pantry","shoppingList"] : ["meals"]); renderAll();
    });
  }
  var photoCancelBtn = document.getElementById("photoCancelBtn");
  if(photoCancelBtn){
    photoCancelBtn.addEventListener("click", function(){
      if(photoUi.previewUrl) URL.revokeObjectURL(photoUi.previewUrl);
      photoUi = { file:null, previewUrl:null, status:"idle", items:[], error:"" };
      renderMeals();
    });
  }
}

/* iOS Shortcuts bridge: a Shortcut can read today's step count from Health and open
   this page with ?steps=N — no backend needed, since it just runs the same code path
   as the manual step form. See NOTES.md "歩数の自動入力（iOSショートカット連携）". */
function applyStepsFromUrl(){
  try{
    var params = new URLSearchParams(location.search);
    if(!params.has("steps")) return;
    var v = Math.max(0, Math.round(parseFloat(params.get("steps"))||0));
    state.steps = state.steps || {};
    state.steps[todayStr()] = v;
    persist(["steps"]);
    var url = new URL(location.href);
    url.searchParams.delete("steps");
    history.replaceState(null, "", url.toString());
    renderAll();
  }catch(e){}
}

/* second iOS Shortcuts bridge, same pattern: a time-triggered Personal Automation opens
   this page with ?checkExpiry=1 — no Health data needed this time, so the Shortcut side
   is just a single "Open URLs" action (no "Find Health Samples"/"Calculate Statistics"
   detour like the steps one needed). See NOTES.md "期限切れ通知（iOSショートカット連携）". */
function checkExpiringItems(){
  var days = (state.notifySettings && typeof state.notifySettings.daysBefore==="number") ? state.notifySettings.daysBefore : 2;
  return state.pantry
    .filter(function(p){ return daysUntil(p.expiry) <= days; })
    .sort(function(a,b){ return daysUntil(a.expiry)-daysUntil(b.expiry); });
}
function applyExpiryCheckFromUrl(){
  try{
    var params = new URLSearchParams(location.search);
    if(!params.has("checkExpiry")) return;
    var url = new URL(location.href);
    url.searchParams.delete("checkExpiry");
    history.replaceState(null, "", url.toString());
    if(!state.notifySettings || !state.notifySettings.enabled) return;
    var items = checkExpiringItems();
    if(!items.length) return;
    var body = items.slice(0,5).map(function(p){
      var d = daysUntil(p.expiry);
      return p.name + "（" + (d<=0 ? "期限切れ" : "あと"+d+"日") + "）";
    }).join("\n");
    if(window.Notification && Notification.permission==="granted"){
      new Notification("賞味期限が近い食材があります", { body: body, icon: "icon-192.png" });
    } else if(window.Notification && Notification.permission!=="denied"){
      Notification.requestPermission().then(function(perm){
        if(perm==="granted") new Notification("賞味期限が近い食材があります", { body: body, icon: "icon-192.png" });
      });
    }
    showToast(items.length+"件の食材が期限間近です");
  }catch(e){}
}

/* ---------- theme toggle ---------- */
function effectiveTheme(){
  var stored = null;
  try{ stored = localStorage.getItem("nutristock_theme"); }catch(e){}
  if(stored==="light" || stored==="dark") return stored;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function applyTheme(){
  var stored = null;
  try{ stored = localStorage.getItem("nutristock_theme"); }catch(e){}
  if(stored==="light" || stored==="dark"){ document.documentElement.dataset.theme = stored; }
  else { delete document.documentElement.dataset.theme; }
  var btn = document.getElementById("themeToggleBtn");
  if(btn) btn.textContent = effectiveTheme()==="dark" ? "☀️" : "🌙";
}
document.getElementById("themeToggleBtn").addEventListener("click", function(){
  var next = effectiveTheme()==="dark" ? "light" : "dark";
  try{ localStorage.setItem("nutristock_theme", next); }catch(e){}
  applyTheme();
});
applyTheme();

initDb();
applyStepsFromUrl();
applyExpiryCheckFromUrl();
})();
</script>
